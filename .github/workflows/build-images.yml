name: build-images

# Build every runtime image on PRs that could affect Rust binaries, Docker
# contexts, or the image workflow. Tagged releases push through
# release-images.yml.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "crates/**"
      - "services/**"
      - "deploy/single-container/**"
      - "buf.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: zinder-ingest
            dockerfile: services/zinder-ingest/Dockerfile
            help_entrypoint: zinder-ingest
          - name: zinder-query
            dockerfile: services/zinder-query/Dockerfile
            help_entrypoint: zinder-query
          - name: zinder-compat-lightwalletd
            dockerfile: services/zinder-compat-lightwalletd/Dockerfile
            help_entrypoint: zinder-compat-lightwalletd
          - name: zinder-derive
            dockerfile: services/zinder-derive/Dockerfile
            help_entrypoint: zinder-derive
          - name: zinder
            dockerfile: deploy/single-container/Dockerfile
            help_entrypoint: zinder-query
    env:
      IMAGE_NAME: ${{ matrix.image.name }}
      HELP_ENTRYPOINT: ${{ matrix.image.help_entrypoint }}
      PR_TAG: pr-${{ github.event.pull_request.number || 'manual' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image.name }}:${{ env.PR_TAG }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Inspect image
        run: |
          docker image inspect "$IMAGE_NAME:$PR_TAG" \
            --format 'image={{.Id}} size_bytes={{.Size}}'

      - name: Smoke test CLI help
        run: |
          docker run --rm --entrypoint="$HELP_ENTRYPOINT" "$IMAGE_NAME:$PR_TAG" --help
