name: build-images

# Build every runtime image on PRs that could affect Rust binaries, Docker
# contexts, or the image workflow. Tagged releases push through release.yml.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "crates/**"
      - "services/**"
      - "deploy/Dockerfile"
      - "deploy/Dockerfile.railway-nocache"
      - "deploy/docker-compose.yml"
      - "railway.toml"
      - "scripts/validate-deployment-admission.sh"
      - "scripts/test-deployment-admission.sh"
      - "buf.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build runtime images (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PR_TAG: pr-${{ github.event.pull_request.number || 'manual' }}-${{ matrix.platform.name }}
      CACHE_SCOPE: zinder-rust-pr-${{ matrix.platform.name }}
      PLATFORM_REF: ${{ matrix.platform.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify deployment admission
        run: bash scripts/test-deployment-admission.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and smoke test images
        run: |
          set -euo pipefail

          images=(
            "zinder-ingest:zinder-ingest:zinder-ingest"
            "zinder-projector:zinder-projector:zinder-projector"
            "zinder-query:zinder-query:zinder-query"
            "zinder-compat-lightwalletd:zinder-compat-lightwalletd:zinder-compat-lightwalletd"
          )

          for image in "${images[@]}"; do
            IFS=: read -r image_name target help_entrypoint <<< "$image"

            docker buildx build \
              --file deploy/Dockerfile \
              --target "$target" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${GITHUB_SHA}" \
              --load \
              --tag "${image_name}:${PR_TAG}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              .

            docker image inspect "${image_name}:${PR_TAG}" \
              --format 'image={{.Id}} size_bytes={{.Size}}'
            docker run --rm --entrypoint="$help_entrypoint" "${image_name}:${PR_TAG}" --help
          done
