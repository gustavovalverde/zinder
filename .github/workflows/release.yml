name: release

# A release tag names the product version already present in Cargo metadata.
# The release environment gates the first registry write. Exact image tags and
# API assets are prepared before the GitHub Release is published, and stable
# `latest` image tags move only after every required artifact succeeds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUF_VERSION: "1.68.2"
  RELEASE_IMAGES_FILE: deploy/release-images.json

jobs:
  validate:
    name: validate release identity
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      release_images: ${{ steps.images.outputs.release_images }}
      stable: ${{ steps.identity.outputs.stable }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify tag, version, and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/validate-release-tag.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "release tag target is not reachable from main" >&2
            exit 1
          }
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"

      - name: Verify release topology
        run: bash scripts/test-deployment-admission.sh

      - name: Resolve release images
        id: images
        run: printf 'release_images=%s\n' "$(jq -c '.' "$RELEASE_IMAGES_FILE")" >> "$GITHUB_OUTPUT"

  api-docs:
    name: build API release artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Generate and verify API artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/generate-api-artifacts.sh

          mkdir -p dist/release
          cp -R dist/openapi dist/release/openapi
          cp dist/zinder.v1.descriptor.bin dist/release/zinder.v1.descriptor.bin
          tar \
            -C dist/release \
            -czf "dist/zinder-api-docs-${RELEASE_TAG}.tar.gz" \
            openapi \
            zinder.v1.descriptor.bin

      - name: Upload API artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-api-docs
          path: |
            dist/zinder.v1.descriptor.bin
            dist/zinder-api-docs-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  authorize:
    name: authorize publication
    needs:
      - validate
      - api-docs
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Record release approval
        run: echo "release publication approved for ${GITHUB_REF_NAME}"

  build:
    name: build image digests (${{ matrix.platform.name }})
    needs:
      - validate
      - api-docs
      - authorize
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digests
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          CACHE_SCOPE: zinder-rust-${{ matrix.platform.name }}-release
          OWNER_RAW: ${{ github.repository_owner }}
          PLATFORM_REF: ${{ matrix.platform.ref }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          mkdir -p /tmp/digests
          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"
          while IFS= read -r image_name; do
            image_ref="ghcr.io/${owner_lc}/${image_name}"
            metadata_file="/tmp/metadata-${image_name}.json"

            docker buildx build \
              --file deploy/Dockerfile \
              --target "$image_name" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${BUILD_GIT_COMMIT}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${BUILD_GIT_COMMIT}" \
              --label "org.opencontainers.image.version=${RELEASE_TAG}" \
              --label "org.opencontainers.image.licenses=MIT" \
              --output "type=image,name=${image_ref},push-by-digest=true,name-canonical=true,push=true" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              --metadata-file "$metadata_file" \
              .

            digest="$(jq -r '."containerimage.digest"' "$metadata_file")"
            if [[ -z "$digest" || "$digest" == null ]]; then
              echo "missing digest for ${image_name}" >&2
              exit 1
            fi
            mkdir -p "/tmp/digests/${image_name}"
            touch "/tmp/digests/${image_name}/${digest#sha256:}"
          done <<< "$image_names"

      - name: Upload image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.platform.name }}
          path: /tmp/digests/**
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish exact ${{ matrix.image }} manifest
    needs:
      - validate
      - build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.validate.outputs.release_images) }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact and commit image tags
        working-directory: /tmp/digests/${{ matrix.image }}
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/${IMAGE_NAME}"
          refs=()
          for digest in *; do
            refs+=("${image}@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "${image}:${RELEASE_TAG}" \
            -t "${image}:sha-${BUILD_GIT_COMMIT}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${image}:${RELEASE_TAG}"

  prepare-release:
    name: prepare draft GitHub Release
    needs:
      - validate
      - api-docs
      - merge
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download API artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-api-docs
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null \
              || true
          )"
          if [[ -n "$release_json" ]]; then
            jq -e '.draft == true' <<< "$release_json" >/dev/null || {
              echo "published GitHub Release ${RELEASE_TAG} already exists" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_args=(
              release create "$RELEASE_TAG" dist/*
              --verify-tag
              --draft
              --generate-notes
              --latest=false
            )
            if [[ "$RELEASE_STABLE" != true ]]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

  publish-release:
    name: publish GitHub Release
    needs:
      - validate
      - prepare-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          publish_args=(release edit "$RELEASE_TAG" --draft=false)
          if [[ "$RELEASE_STABLE" == true ]]; then
            publish_args+=(--latest)
          else
            publish_args+=(--prerelease --latest=false)
          fi
          gh "${publish_args[@]}"

  promote-latest:
    name: promote stable image tags
    if: needs.validate.outputs.stable == 'true'
    needs:
      - validate
      - publish-release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact manifests and promote latest
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"

          while IFS= read -r image_name; do
            docker buildx imagetools inspect \
              "ghcr.io/${owner_lc}/${image_name}:${RELEASE_TAG}" >/dev/null
          done <<< "$image_names"
          while IFS= read -r image_name; do
            image="ghcr.io/${owner_lc}/${image_name}"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${RELEASE_TAG}"
            docker buildx imagetools inspect "${image}:latest"
          done <<< "$image_names"
