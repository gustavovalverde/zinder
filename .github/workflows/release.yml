name: release

# A release tag names the product version already present in Cargo metadata.
# The release environment gates the first registry write. Exact image tags and
# API assets are prepared before the GitHub Release is published, and stable
# `latest` image tags move only after every required artifact succeeds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  BUF_VERSION: "1.68.2"
  RELEASE_IMAGES_FILE: deploy/release-images.json

jobs:
  validate:
    name: validate release identity
    runs-on: ubuntu-latest
    outputs:
      base_commit: ${{ steps.identity.outputs.base_commit }}
      commit: ${{ steps.identity.outputs.commit }}
      release_images: ${{ steps.images.outputs.release_images }}
      stable: ${{ steps.identity.outputs.stable }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Changie
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3.0.0
        with:
          version: v1.25.1

      - name: Verify tag, version, and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/validate-release-tag.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "release tag target is not reachable from main" >&2
            exit 1
          }
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          previous_tag="$(
            git describe \
              --first-parent \
              --tags \
              --abbrev=0 \
              --match 'v[0-9]*' \
              "${release_commit}^"
          )"
          previous_version="${previous_tag#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          [[ "$previous_tag" == v* && "$previous_version" =~ $semver_pattern ]] || {
            echo "preceding product tag is not complete SemVer: ${previous_tag}" >&2
            exit 1
          }
          prerelease="${BASH_REMATCH[5]:-}"
          IFS=. read -r -a prerelease_identifiers <<< "$prerelease"
          for identifier in "${prerelease_identifiers[@]}"; do
            [[ ! "$identifier" =~ ^0[0-9]+$ ]] || {
              echo "preceding product tag has a numeric prerelease identifier with a leading zero" >&2
              exit 1
            }
          done
          previous_commit="$(git rev-parse "${previous_tag}^{commit}")"
          printf 'base_commit=%s\n' "$previous_commit" >> "$GITHUB_OUTPUT"

      - name: Verify and extract release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bash scripts/validate-changelog.sh release "$RELEASE_TAG"
          bash scripts/extract-release-notes.sh "$RELEASE_TAG" \
            > dist/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Verify release topology
        run: bash scripts/test-deployment-admission.sh

      - name: Resolve release images
        id: images
        run: printf 'release_images=%s\n' "$(jq -c '.' "$RELEASE_IMAGES_FILE")" >> "$GITHUB_OUTPUT"

  binary-archives:
    name: build binary archive (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: aarch64-unknown-linux-gnu
            docker: linux/arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build, verify, and reproduce archive
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RUST_TARGET: ${{ matrix.platform.rust }}
          TARGET_PLATFORM: ${{ matrix.platform.docker }}
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          for build_number in 1 2; do
            export_root="${RUNNER_TEMP}/binary-export-${build_number}"
            archive_root="${RUNNER_TEMP}/binary-archive-${build_number}"
            docker buildx build \
              --no-cache \
              --platform "$TARGET_PLATFORM" \
              --target release-binaries \
              --build-arg "RELEASE_CACHE_SCOPE=release-${RELEASE_COMMIT}-${RUST_TARGET}-${build_number}" \
              --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${RELEASE_COMMIT}" \
              --output "type=local,dest=${export_root}" \
              --file deploy/Dockerfile \
              .
            scripts/build-release-binary-archive.sh \
              --binaries "${export_root}/bin" \
              --output "$archive_root" \
              --version "$RELEASE_VERSION" \
              --tag "$RELEASE_TAG" \
              --commit "$RELEASE_COMMIT" \
              --target "$RUST_TARGET" \
              --source-date-epoch "$source_date_epoch"
            archive_path="$(find "$archive_root" -maxdepth 1 -type f -name '*.tar.gz')"
            scripts/check-release-binary-archive.sh "$archive_path" \
              --version "$RELEASE_VERSION" \
              --tag "$RELEASE_TAG" \
              --commit "$RELEASE_COMMIT" \
              --target "$RUST_TARGET" \
              --source-date-epoch "$source_date_epoch"
          done

          docker run --rm \
            --platform "$TARGET_PLATFORM" \
            --volume "${RUNNER_TEMP}/binary-export-1/bin:/opt/zinder/bin:ro" \
            debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
            sh -ec '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends ca-certificates libstdc++6 >/dev/null
              for binary in /opt/zinder/bin/*; do
                "$binary" --version
                "$binary" --help >/dev/null
              done
            '

          find "${RUNNER_TEMP}/binary-export-1/bin" -maxdepth 1 -type f -printf '%f\n' \
            | sort \
            | while IFS= read -r binary_name; do
                first="$(sha256sum "${RUNNER_TEMP}/binary-export-1/bin/${binary_name}" | awk '{print $1}')"
                second="$(sha256sum "${RUNNER_TEMP}/binary-export-2/bin/${binary_name}" | awk '{print $1}')"
                [[ "$first" == "$second" ]]
              done
          first_archive="$(find "${RUNNER_TEMP}/binary-archive-1" -maxdepth 1 -type f -name '*.tar.gz')"
          second_archive="$(find "${RUNNER_TEMP}/binary-archive-2" -maxdepth 1 -type f -name '*.tar.gz')"
          [[ "$(sha256sum "$first_archive" | awk '{print $1}')" == \
             "$(sha256sum "$second_archive" | awk '{print $1}')" ]]

          mkdir -p dist/binary-archive
          cp "$first_archive" dist/binary-archive/

      - name: Upload binary archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binary-${{ matrix.platform.name }}
          path: dist/binary-archive/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  collect-binary-assets:
    name: collect binary release assets
    needs:
      - validate
      - binary-archives
    runs-on: ubuntu-latest
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/binaries
          pattern: release-binary-*
          merge-multiple: true

      - name: Verify binary asset catalog
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          expected="$({
            printf '%s\n' \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.tar.gz"
          })"
          actual="$(find dist/binaries -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]]
          (
            cd dist/binaries
            sha256sum *.tar.gz | sort -k2 > SHA256SUMS
          )

      - name: Upload binary release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binary-assets
          path: dist/binaries
          if-no-files-found: error
          retention-days: 7

  api-docs:
    name: build API release artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Generate and verify API artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/generate-api-artifacts.sh

          mkdir -p dist/release
          cp -R dist/openapi dist/release/openapi
          cp -R dist/proto dist/release/proto
          cp dist/zinder.v1.descriptor.bin dist/release/zinder.v1.descriptor.bin
          bash scripts/check-native-proto-closure.sh dist/release
          tar \
            -C dist/release \
            -czf "dist/zinder-api-docs-${RELEASE_TAG}.tar.gz" \
            openapi \
            proto \
            zinder.v1.descriptor.bin

      - name: Upload API artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-api-docs
          path: |
            dist/zinder.v1.descriptor.bin
            dist/zinder-api-docs-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sdk-packages:
    name: verify public SDK packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Verify public SDK packages
        id: package-readiness
        continue-on-error: true
        env:
          PROTOC: /does/not/exist
        run: scripts/verify-sdk-packages.sh

      - name: Check desired SDK release state
        id: cargo-release
        continue-on-error: true
        uses: ZcashFoundation/cargo-release@34a37595755444456ce0e2d2b1258d9a29c14fac
        with:
          phase: check
          base-sha: ${{ needs.validate.outputs.base_commit }}
          target-sha: ${{ needs.validate.outputs.commit }}
          github-token: ${{ github.token }}
        env:
          CARGO_INCREMENTAL: "0"
          PROTOC: /does/not/exist

      - name: Summarize SDK release readiness
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          PACKAGE_RESULT: ${{ steps.package-readiness.outcome }}
          PLAN: ${{ steps.cargo-release.outputs.plan }}
          REPORT: ${{ steps.cargo-release.outputs.report }}
        run: |
          {
            echo "## SDK release readiness"
            echo "| Validation | Result |"
            echo "| --- | --- |"
            echo "| Hermetic packages | \`${PACKAGE_RESULT}\` |"
            echo "| Cargo Release | \`${CARGO_RELEASE_RESULT}\` |"
            if [[ -n "${PLAN}" ]]; then
              echo "### Plan"
              echo '```json'
              jq . <<< "${PLAN}"
              echo '```'
            fi
            if [[ -n "${REPORT}" ]]; then
              echo "### Observed state"
              echo '```json'
              jq . <<< "${REPORT}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful SDK release readiness
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          PACKAGE_RESULT: ${{ steps.package-readiness.outcome }}
        run: |
          if [[ "$PACKAGE_RESULT" != success || "$CARGO_RELEASE_RESULT" != success ]]; then
            echo "::error::Review each failed SDK readiness step and the job summary."
            exit 1
          fi

  publish-sdk-crates:
    name: publish public SDK crates
    needs:
      - validate
      - api-docs
      - collect-binary-assets
      - sdk-packages
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish and verify missing SDK crates
        uses: ZcashFoundation/cargo-release@34a37595755444456ce0e2d2b1258d9a29c14fac
        with:
          phase: publish
          base-sha: ${{ needs.validate.outputs.base_commit }}
          target-sha: ${{ needs.validate.outputs.commit }}
          github-token: ${{ github.token }}
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          PROTOC: /does/not/exist

      - name: Verify the published SDK from crates.io
        timeout-minutes: 30
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/verify-published-sdk.sh "$SDK_VERSION"

  build:
    name: build image digests (${{ matrix.platform.name }})
    needs:
      - validate
      - api-docs
      - publish-sdk-crates
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digests
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          CACHE_SCOPE: zinder-rust-${{ matrix.platform.name }}-release
          OWNER_RAW: ${{ github.repository_owner }}
          PLATFORM_REF: ${{ matrix.platform.ref }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          mkdir -p /tmp/digests
          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"
          while IFS= read -r image_name; do
            image_ref="ghcr.io/${owner_lc}/${image_name}"
            metadata_file="/tmp/metadata-${image_name}.json"

            docker buildx build \
              --file deploy/Dockerfile \
              --target "$image_name" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${BUILD_GIT_COMMIT}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${BUILD_GIT_COMMIT}" \
              --label "org.opencontainers.image.version=${RELEASE_TAG}" \
              --label "org.opencontainers.image.licenses=MIT" \
              --output "type=image,name=${image_ref},push-by-digest=true,name-canonical=true,push=true" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              --metadata-file "$metadata_file" \
              .

            digest="$(jq -r '."containerimage.digest"' "$metadata_file")"
            if [[ -z "$digest" || "$digest" == null ]]; then
              echo "missing digest for ${image_name}" >&2
              exit 1
            fi
            mkdir -p "/tmp/digests/${image_name}"
            touch "/tmp/digests/${image_name}/${digest#sha256:}"
          done <<< "$image_names"

      - name: Upload image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.platform.name }}
          path: /tmp/digests/**
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish exact ${{ matrix.image }} manifest
    needs:
      - validate
      - build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.validate.outputs.release_images) }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact and commit image tags
        working-directory: /tmp/digests/${{ matrix.image }}
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/${IMAGE_NAME}"
          refs=()
          for digest in *; do
            refs+=("${image}@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "${image}:${RELEASE_TAG}" \
            -t "${image}:sha-${BUILD_GIT_COMMIT}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${image}:${RELEASE_TAG}"

  prepare-release:
    name: prepare draft GitHub Release
    needs:
      - validate
      - api-docs
      - collect-binary-assets
      - merge
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download API artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-api-docs
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release-notes

      - name: Download binary release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binary-assets
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null \
              || true
          )"
          if [[ -n "$release_json" ]]; then
            jq -e '.draft == true' <<< "$release_json" >/dev/null || {
              echo "published GitHub Release ${RELEASE_TAG} already exists" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" \
              --notes-file release-notes/release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_args=(
              release create "$RELEASE_TAG" dist/*
              --verify-tag
              --draft
              --notes-file release-notes/release-notes.md
              --latest=false
            )
            if [[ "$RELEASE_STABLE" != true ]]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

  publish-release:
    name: publish GitHub Release
    needs:
      - validate
      - prepare-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          publish_args=(release edit "$RELEASE_TAG" --draft=false)
          if [[ "$RELEASE_STABLE" == true ]]; then
            publish_args+=(--latest)
          else
            publish_args+=(--prerelease --latest=false)
          fi
          gh "${publish_args[@]}"

  promote-latest:
    name: promote stable image tags
    if: needs.validate.outputs.stable == 'true'
    needs:
      - validate
      - publish-release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact manifests and promote latest
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"

          while IFS= read -r image_name; do
            docker buildx imagetools inspect \
              "ghcr.io/${owner_lc}/${image_name}:${RELEASE_TAG}" >/dev/null
          done <<< "$image_names"
          while IFS= read -r image_name; do
            image="ghcr.io/${owner_lc}/${image_name}"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${RELEASE_TAG}"
            docker buildx imagetools inspect "${image}:latest"
          done <<< "$image_names"
