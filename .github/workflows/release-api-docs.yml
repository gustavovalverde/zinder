name: release-api-docs

# Build and attach the two release artifacts described in ADR-0022:
#   - OpenAPI YAML  (transcoded from the proto surface)
#   - FileDescriptorSet binary (canonical schema export for grpcurl tooling)
#
# Triggered on release tags (v*) or manually for a dry-run. Both artifacts
# get attached to the GitHub Release; the same workflow can be extended
# later to push to a documentation domain.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-api-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: generate API docs
    runs-on: ubuntu-latest
    env:
      GIT_REF: ${{ github.ref }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.68.2"

      - name: Resolve version
        id: version
        run: |
          version="${GIT_REF#refs/tags/}"
          if [ "$version" = "$GIT_REF" ]; then
            version="manual-$(printf '%s' "$GIT_SHA" | cut -c1-12)"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Generate OpenAPI YAML
        run: |
          mkdir -p dist/openapi
          buf generate

      - name: Build FileDescriptorSet
        run: |
          buf build --output dist/zinder.v1.descriptor.bin

      - name: Stage artifacts
        run: |
          mkdir -p dist/release
          cp -r dist/openapi dist/release/openapi
          cp dist/zinder.v1.descriptor.bin dist/release/zinder.v1.descriptor.bin
          tar -C dist/release -czf dist/zinder-api-docs.tar.gz openapi zinder.v1.descriptor.bin
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zinder-api-docs
          path: |
            dist/openapi/
            dist/zinder.v1.descriptor.bin
            dist/zinder-api-docs.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zinder.v1.descriptor.bin
            dist/zinder-api-docs.tar.gz
