name: release-images

# Build and push each service's Docker image plus the single-container image
# to ghcr.io when a release tag lands. Use workflow_dispatch to dry-run.
#
# Tag convention:
#   - tag is `v<semver>` (e.g. `v0.2.0`)
#   - images published as ghcr.io/<owner>/<service>:v<semver> and :latest
#
# Build topology mirrors Zebra's `zfnd-build-docker-image.yml`: each
# (image, platform) pair builds on its native runner (amd64 on
# `ubuntu-latest`, arm64 on `ubuntu-24.04-arm`) and pushes by digest. A
# per-image merge job then assembles the multi-arch manifest with all
# tags. This avoids QEMU emulation, which makes the arm64 leg 5-10x
# slower on the standard amd64 runner.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-per-service:
    name: build ${{ matrix.service }} (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - zinder-ingest
          - zinder-query
          - zinder-compat-lightwalletd
          - zinder-derive
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve image name
        id: name
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          printf 'image=ghcr.io/%s/%s\n' "$owner_lc" "$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform.ref }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.name }}-release
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.name }}-release,mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-per-service:
    name: merge ${{ matrix.service }}
    needs: build-per-service
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - zinder-ingest
          - zinder-query
          - zinder-compat-lightwalletd
          - zinder-derive
    steps:
      - name: Resolve image and tags
        id: tags
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          GIT_REF: ${{ github.event.inputs.ref || github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          version="${GIT_REF#refs/tags/}"
          if [ "$version" = "$GIT_REF" ]; then
            version="manual-$(printf '%s' "$GIT_SHA" | cut -c1-12)"
          fi
          {
            printf 'image=ghcr.io/%s/%s\n' "$owner_lc" "$SERVICE"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  build-single-container:
    name: build single-container (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve image name
        id: name
        env:
          OWNER_RAW: ${{ github.repository_owner }}
        run: |
          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          printf 'image=ghcr.io/%s/zinder\n' "$owner_lc" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/single-container/Dockerfile
          platforms: ${{ matrix.platform.ref }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=zinder-single-container-${{ matrix.platform.name }}-release
          cache-to: type=gha,scope=zinder-single-container-${{ matrix.platform.name }}-release,mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-single-container-${{ matrix.platform.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-single-container:
    name: merge single-container
    needs: build-single-container
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image and tags
        id: tags
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          GIT_REF: ${{ github.event.inputs.ref || github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          version="${GIT_REF#refs/tags/}"
          if [ "$version" = "$GIT_REF" ]; then
            version="manual-$(printf '%s' "$GIT_SHA" | cut -c1-12)"
          fi
          {
            printf 'image=ghcr.io/%s/zinder\n' "$owner_lc"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-single-container-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
