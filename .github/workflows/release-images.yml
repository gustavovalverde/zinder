name: release-images

# Build and push the wallet-serving service images to ghcr.io
# when a release tag lands. The optional explorer runtime and mixed
# single-container bundle are intentionally not release artifacts. Use
# workflow_dispatch to dry-run.
#
# Tag convention:
#   - tag is `v<semver>` (e.g. `v0.2.0`)
#   - images published as ghcr.io/<owner>/<image>:v<semver> and :latest
#
# Each platform builds on its native runner. Within a platform job, every image
# target shares the same `zinder-binaries` Docker stage and BuildKit cache scope,
# so Rust dependencies and RocksDB native artifacts are compiled once per
# platform instead of once per service image.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-admission:
    name: deployment admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Verify release topology admission
        run: bash scripts/test-deployment-admission.sh

  build:
    name: build images (${{ matrix.platform.name }})
    needs: deployment-admission
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digests
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          PLATFORM_REF: ${{ matrix.platform.ref }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          CACHE_SCOPE: zinder-rust-${{ matrix.platform.name }}-release
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          mkdir -p /tmp/digests

          images=(
            "zinder-ingest:zinder-ingest"
            "zinder-projector:zinder-projector"
            "zinder-query:zinder-query"
            "zinder-compat-lightwalletd:zinder-compat-lightwalletd"
          )

          for image in "${images[@]}"; do
            IFS=: read -r image_name target <<< "$image"
            image_ref="ghcr.io/${owner_lc}/${image_name}"
            metadata_file="/tmp/metadata-${image_name}.json"

            docker buildx build \
              --file deploy/Dockerfile \
              --target "$target" \
              --platform "$PLATFORM_REF" \
              --output "type=image,name=${image_ref},push-by-digest=true,name-canonical=true,push=true" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              --metadata-file "$metadata_file" \
              .

            digest="$(jq -r '."containerimage.digest"' "$metadata_file")"
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "missing digest for ${image_name}" >&2
              exit 1
            fi

            mkdir -p "/tmp/digests/${image_name}"
            touch "/tmp/digests/${image_name}/${digest#sha256:}"
          done

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform.name }}
          path: /tmp/digests/**
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - zinder-ingest
          - zinder-projector
          - zinder-query
          - zinder-compat-lightwalletd
    steps:
      - name: Resolve image and tags
        id: tags
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
          GIT_REF: ${{ github.event.inputs.ref || github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          version="${GIT_REF#refs/tags/}"
          if [ "$version" = "$GIT_REF" ]; then
            version="manual-$(printf '%s' "$GIT_SHA" | cut -c1-12)"
          fi
          {
            printf 'image=ghcr.io/%s/%s\n' "$owner_lc" "$IMAGE_NAME"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests/${{ matrix.image }}
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail

          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
