name: release-images

# Build and push each service's Docker image plus the single-container image
# to ghcr.io when a release tag lands. Use workflow_dispatch to dry-run.
#
# Tag convention:
#   - tag is `v<semver>` (e.g. `v0.2.0`)
#   - images published as ghcr.io/<owner>/<service>:v<semver> and :latest

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  per-service:
    name: push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - zinder-ingest
          - zinder-query
          - zinder-compat-lightwalletd
          - zinder-derive
    env:
      SERVICE: ${{ matrix.service }}
      OWNER: ${{ github.repository_owner }}
      GIT_REF: ${{ github.ref }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          version="${GIT_REF#refs/tags/}"
          if [ "$version" = "$GIT_REF" ]; then
            version="manual-$(printf '%s' "$GIT_SHA" | cut -c1-12)"
          fi
          {
            printf 'owner=%s\n' "$owner_lc"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.tags.outputs.owner }}/${{ matrix.service }}:${{ steps.tags.outputs.version }}
            ghcr.io/${{ steps.tags.outputs.owner }}/${{ matrix.service }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.service }}-release
          cache-to: type=gha,scope=${{ matrix.service }}-release,mode=max

  single-container:
    name: push single-container
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      GIT_REF: ${{ github.ref }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          version="${GIT_REF#refs/tags/}"
          if [ "$version" = "$GIT_REF" ]; then
            version="manual-$(printf '%s' "$GIT_SHA" | cut -c1-12)"
          fi
          {
            printf 'owner=%s\n' "$owner_lc"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push single-container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/single-container/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.tags.outputs.owner }}/zinder:${{ steps.tags.outputs.version }}
            ghcr.io/${{ steps.tags.outputs.owner }}/zinder:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=zinder-single-container-release
          cache-to: type=gha,scope=zinder-single-container-release,mode=max
