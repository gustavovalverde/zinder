# Workspace nextest profiles. The Testing Runbook owns the tier definitions;
# service operations records the operator-facing validation shape.
#
# Tiers:
#   T0 unit         -> #[cfg(test)] mod tests in src/   (default-filter)
#   T1 integration  -> tests/integration/               (default-filter)
#   T2 perf         -> tests/perf/                      (ci-perf profile)
#   T3 live         -> tests/live/                      (ci-live profile)
#   T3 Zallet live  -> tests/live/zallet.rs             (ci-zallet-live profile)
#   T3 deploy       -> tests/deploy/                    (ci-deploy profile)
#   T4 parity       -> tests/parity/                    (ci-parity profile)
#
# default-filter is the structural boundary between tiers; #[ignore] is the
# libtest-fallback safety net for `cargo test` users without nextest. Both
# must remain in place; either alone is insufficient.

[profile.default]
slow-timeout = { period = "10s", terminate-after = 2 }
fail-fast = false
default-filter = "not test(/^live::/) and not test(/^perf::/) and not test(/^parity::/) and not test(/^deploy::/)"

[profile.ci]
inherits = "default"
retries = { count = 1, backoff = "exponential", delay = "1s" }
final-status-level = "fail"
junit = { path = "target/nextest/junit.xml" }

[profile.ci-perf]
default-filter = "test(/^perf::/)"
slow-timeout = { period = "5m", terminate-after = 1 }
junit = { path = "target/nextest/perf.xml" }

[profile.ci-live]
default-filter = "test(/^live::/) and not test(/^live::zallet::/)"
retries = { count = 2, backoff = "exponential", delay = "5s" }
slow-timeout = { period = "60s", terminate-after = 1 }
junit = { path = "target/nextest/live.xml" }

[profile.ci-zallet-live]
default-filter = "test(/^live::zallet::/)"
retries = { count = 1, backoff = "exponential", delay = "5s" }
slow-timeout = { period = "2m", terminate-after = 1 }
junit = { path = "target/nextest/zallet-live.xml" }

# Deployment-tier smoke tests build the actual `deploy/single-container`
# image and exercise it end-to-end against the regtest sidecar. Slow and
# Docker-dependent; the per-PR pipeline skips this profile, and the
# nightly/release pipeline runs it on the matrix that has Docker available.
# Tests live under `tests/deploy/` and are double-gated by
# `#[ignore = DEPLOY_TEST_IGNORE_REASON]` plus a runtime `require_docker()`
# probe so a developer machine without Docker silently skips instead of
# failing the live-suite run.
[profile.ci-deploy]
default-filter = "test(/^deploy::/)"
# The first invocation builds the deploy image from scratch (RocksDB + zstd-sys
# go through bindgen, the Rust workspace compiles in release mode); the cold
# build can run 10+ minutes on a clean cache. Subsequent invocations hit the
# Docker layer cache and finish in seconds. Set the slow-timeout to 15m so
# cold builds do not get killed on the first pass.
slow-timeout = { period = "15m", terminate-after = 1 }
junit = { path = "target/nextest/deploy.xml" }

# Consumer-release certification tier. Per-consumer parity
# assertions live under `tests/parity/` in each crate that surfaces a public
# consumer contract. The release-tag pipeline runs this profile as a release
# gate; per-PR runs are advisory.
[profile.ci-parity]
default-filter = "test(/^parity::/)"
slow-timeout = { period = "60s", terminate-after = 1 }
junit = { path = "target/nextest/parity.xml" }

# Live tests that mutate node state share a single Docker container.
# Read-only live tests (capability probes, tip fetches, broadcast-rejection
# classification) run in parallel under the default group; only mutators join
# this group via per-test override below.
[test-groups]
node-mutating = { max-threads = 1 }

[[profile.ci-live.overrides]]
# Tests that share or contend on the upstream node's process state must
# serialize through `node-mutating`. The Zebra indexer gRPC port is a single
# upstream resource: any test that opens an indexer stream races with the
# destructive container-restart test, so all indexer consumers join here.
# `ingest_control_tip_change_publisher_fires_when_zebra_mines_block` mutates
# regtest chain state via `generate`, so it joins too.
filter = "test(live::deep_chain) or test(live::tip_follow) or test(live::cli) or test(/live::zebra_indexer_mempool::/) or test(/live::mempool_broadcast_cycle::/) or test(/live::reorg_sweep::/) or test(mempool_orchestrator_runs_against_real_zebra_indexer_with_in_memory_state) or test(ingest_control_tip_change_publisher_fires_when_zebra_mines_block)"
test-group = "node-mutating"

[[profile.ci-live.overrides]]
filter = "test(backfills_last_1000_blocks_from_checkpoint)"
slow-timeout = { period = "5m", terminate-after = 1 }
