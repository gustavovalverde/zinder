# buf generation config for Zinder's public proto exports.
#
# OpenAPI output and descriptor sets are produced from the same proto module
# declared in buf.yaml. The vendored lightwalletd schemas under proto/compat
# are excluded; downstream consumers consuming `lightwalletd` already have its
# public protocol.
#
# Build invocation (per-release; the CI workflow at
# .github/workflows/release.yml and protocol-contracts.yml run the same commands):
#
#   buf generate           # OpenAPI YAML into dist/openapi/
#   buf build -o dist/zinder.v1.descriptor.bin
#
# The descriptor set artifact is built directly by `buf build` (no plugin);
# the OpenAPI artifact uses the protoc-gen-openapiv2 plugin pinned below.

version: v2

clean: true

# The OpenAPI generator uses Go's protobuf registry internally even though
# Zinder does not publish generated Go sources. Managed mode supplies those
# import paths without adding language-specific options to the source schemas.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/gustavovalverde/zinder/gen/go

plugins:
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.29.0
    out: dist/openapi
    opt:
      - logtostderr=true
      # OpenAPI 3.0 output. v2 plugin still emits OAS 2.0 by default; v3 is
      # opt-in via openapi_naming_strategy/output_format. Default v2 output
      # is the broadest-tooling baseline; ReDoc and Swagger UI both render
      # it directly.
      - output_format=yaml
      - json_names_for_fields=true
      - simple_operation_ids=false
      - allow_repeated_fields_in_body=true
      - generate_unbound_methods=true
