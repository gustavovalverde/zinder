[package]
name = "zinder-projector"
version = "0.1.0"
description = "Zinder wallet projection construction service"
edition.workspace = true
readme = "../../README.md"
keywords = ["zcash", "indexer", "wallet"]
categories = ["database"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
getrandom.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["transport"] }
tracing.workspace = true
zinder-proto.workspace = true
zinder-core.workspace = true
zinder-runtime.workspace = true
zinder-source.workspace = true
zinder-store.workspace = true
zinder-wallet-projection.workspace = true
zinder-wallet-rocksdb.workspace = true

[dev-dependencies]
eyre.workspace = true
tempfile.workspace = true
zinder-testkit.workspace = true

[[bin]]
name = "zinder-projector"
path = "src/bin/zinder-projector/main.rs"

[lints]
workspace = true
