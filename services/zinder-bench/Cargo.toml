[package]
name = "zinder-bench"
version = "0.1.0"
description = "Zinder fixed-range capture and replay benchmark harness"
edition.workspace = true
readme = "README.md"
keywords = ["zcash", "indexer", "benchmark"]
categories = ["command-line-utilities"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
clap = { workspace = true, features = ["derive"] }
futures-util.workspace = true
hex.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zinder-core.workspace = true
zinder-derive.workspace = true
zinder-ingest.workspace = true
zinder-source.workspace = true
zinder-store.workspace = true

[lints]
workspace = true

[dev-dependencies]
eyre.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
zinder-testkit.workspace = true
