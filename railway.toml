[build]
builder = "DOCKERFILE"
# Railway BuildKit rejects unscoped cache mount IDs and any ${...}
# interpolation in `id`, so the Railway-friendly Dockerfile drops cache
# mounts entirely. Local builds still use deploy/Dockerfile and keep
# the templated cache hits. Services that want the per-service cache
# can override RAILWAY_DOCKERFILE_PATH=deploy/Dockerfile.railway after
# regenerating that file with the right service ID prefix.
dockerfilePath = "deploy/Dockerfile.railway-nocache"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
