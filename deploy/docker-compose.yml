# Fact-first single-host wallet-serving topology.
#
# The three release runtimes share one host filesystem. zinder-ingest is the
# only canonical writer, zinder-projector is the only wallet writer, and
# zinder-compat-lightwalletd serves immutable canonical/wallet secondary pairs.
# Projector and compat share ingest's network namespace so the authenticated
# control plane remains loopback-only.
name: zinder-${Z3_NETWORK_LOWER:-mainnet}

networks:
  z3:
    external: true
    name: z3-${Z3_NETWORK_LOWER:-mainnet}
  observability:
    name: ${ZINDER_OBSERVABILITY_NETWORK_NAME:-zinder-${Z3_NETWORK_LOWER:-mainnet}-observability}

services:
  state-init:
    image: debian:bookworm-slim
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "chown -R 1000:1000 /var/lib/zinder /var/lib/zinder/checkpoints",
      ]
    volumes:
      - type: volume
        source: data
        target: /var/lib/zinder
        volume:
          nocopy: true
      - type: volume
        source: checkpoint-staging
        target: /var/lib/zinder/checkpoints
        volume:
          nocopy: true

  zinder-ingest:
    image: ${ZINDER_INGEST_IMAGE:-zinder-ingest:latest}
    mem_limit: ${ZINDER_INGEST_MEMORY_LIMIT:-14g}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-ingest
    restart: on-failure
    depends_on:
      state-init:
        condition: service_completed_successfully
    networks: [z3, observability]
    volumes:
      - data:/var/lib/zinder
      - checkpoint-staging:/var/lib/zinder/checkpoints
      - ./config/ingest.toml:/etc/zinder/config.toml:ro
      - z3-cookie:/var/run/auth:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/checkpoint.token:/var/run/zinder-checkpoint/checkpoint.token:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:-zcash-mainnet}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:-http://zebra:8232}
      ZINDER_NODE__INDEXER_GRPC_ADDR: ${ZINDER_NODE__INDEXER_GRPC_ADDR-http://zebra:8230}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      # Namespace-wide binds are explicit deployment opt-ins. Host publication
      # below remains loopback-only, while Prometheus reaches ops internally.
      ZINDER_OPS__LISTEN_ADDR: "[::]:9105"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    ports:
      - "127.0.0.1:${ZINDER_INGEST_OPS_HOST_PORT:-9105}:9105"
      - "127.0.0.1:${ZINDER_COMPAT_HOST_PORT:-9067}:9067"
      - "127.0.0.1:${ZINDER_PROJECTOR_OPS_HOST_PORT:-9110}:9110"
      - "127.0.0.1:${ZINDER_COMPAT_OPS_HOST_PORT:-9107}:9107"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9105/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  zinder-projector:
    image: ${ZINDER_PROJECTOR_IMAGE:-zinder-projector:latest}
    mem_limit: ${ZINDER_PROJECTOR_MEMORY_LIMIT:-10g}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-projector
    restart: on-failure
    network_mode: "service:zinder-ingest"
    depends_on:
      zinder-ingest:
        condition: service_healthy
    volumes:
      - data:/var/lib/zinder
      - checkpoint-staging:/var/lib/zinder/checkpoints
      - ./config/projector.toml:/etc/zinder/config.toml:ro
      - z3-cookie:/var/run/auth:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/checkpoint.token:/var/run/zinder-checkpoint/checkpoint.token:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:-zcash-mainnet}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:-http://zebra:8232}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      ZINDER_PROJECTOR__BUILD_OWNER_HEX: ${ZINDER_PROJECTOR_BUILD_OWNER_HEX:?set a stable 32-character hexadecimal projector owner}
      ZINDER_OPS__LISTEN_ADDR: "[::]:9110"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9110/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  zinder-compat-lightwalletd:
    image: ${ZINDER_COMPAT_IMAGE:-zinder-compat-lightwalletd:latest}
    mem_limit: ${ZINDER_COMPAT_MEMORY_LIMIT:-4g}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-compat-lightwalletd
    restart: on-failure
    network_mode: "service:zinder-ingest"
    depends_on:
      zinder-ingest:
        condition: service_healthy
      zinder-projector:
        condition: service_healthy
    volumes:
      - data:/var/lib/zinder
      - ./config/compat-lightwalletd.toml:/etc/zinder/config.toml:ro
      - z3-cookie:/var/run/auth:ro
      - ${ZINDER_INGEST_CONTROL_SECRET_DIR:?set a directory containing ingest.token only}/ingest.token:/var/run/zinder-control/ingest.token:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:-zcash-mainnet}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:-http://zebra:8232}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      ZINDER_COMPAT__LISTEN_ADDR: "[::]:9067"
      ZINDER_OPS__LISTEN_ADDR: "[::]:9107"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9107/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  zinder-prometheus:
    image: prom/prometheus:v3.2.0
    mem_limit: ${ZINDER_PROMETHEUS_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    networks: [observability]
    volumes:
      - prometheus:/prometheus
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${ZINDER_PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${ZINDER_PROMETHEUS_HOST_PORT:-9095}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  zinder-grafana:
    image: grafana/grafana:11.5.1
    mem_limit: ${ZINDER_GRAFANA_MEMORY_LIMIT:-512m}
    restart: unless-stopped
    profiles: [observability]
    networks: [observability]
    depends_on:
      zinder-prometheus:
        condition: service_healthy
    volumes:
      - grafana:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${ZINDER_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zinder-overview.json
    ports:
      - "127.0.0.1:${ZINDER_GRAFANA_HOST_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
    name: ${ZINDER_SINGLE_HOST_DATA_VOLUME_NAME:-zinder-${Z3_NETWORK_LOWER:-mainnet}-data}
  checkpoint-staging:
    name: ${ZINDER_CHECKPOINT_STAGING_VOLUME_NAME:-zinder-${Z3_NETWORK_LOWER:-mainnet}-checkpoints}
  prometheus:
    name: ${ZINDER_PROMETHEUS_VOLUME_NAME:-zinder-${Z3_NETWORK_LOWER:-mainnet}-prometheus}
  grafana:
    name: ${ZINDER_GRAFANA_VOLUME_NAME:-zinder-${Z3_NETWORK_LOWER:-mainnet}-grafana}
  z3-cookie:
    external: true
    name: z3-${Z3_NETWORK_LOWER:-mainnet}-cookie
