# Select this config file only on the isolated canary service and set
# RAILWAY_DOCKER_TARGET_STAGE=zinder-canonical-runtime on that service.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.railway-nocache"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = "0"
drainingSeconds = "30"
