# nginx multiplexer for the zinder single-container image.
#
# zinder-query and zinder-explorer each bind h2c on a different port
# (9101 and 9068 respectively). PaaS targets like Railway cap a service
# at one TCP proxy and refuse to terminate HTTPS-to-h2c on their HTTP
# edge, so callers cannot reach both planes directly from outside.
#
# This nginx listens h2c on 9099 and routes gRPC requests by their
# `:path` prefix to the right localhost backend, giving operators one
# externally-exposed port that fronts both planes. The supervising s6
# service starts after zinder-query AND zinder-explorer accept loopback
# connections, so nginx never serves a 502 because its upstream is not
# yet bound.

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  default_type application/grpc;
  access_log off;

  grpc_socket_keepalive on;
  grpc_send_timeout 1h;
  grpc_read_timeout 1h;

  upstream zinder_wallet {
    server 127.0.0.1:9101;
    keepalive 16;
  }
  upstream zinder_explorer {
    server 127.0.0.1:9068;
    keepalive 16;
  }
  upstream zinder_ingest_ops {
    server 127.0.0.1:9105;
    keepalive 4;
  }

  server {
    listen 9099 http2;
    listen [::]:9099 http2;

    # Single-process supervision means nginx restarts when zinder restarts.
    # Health endpoint helps the PaaS verify the multiplexer plane.
    location = /healthz {
      default_type text/plain;
      return 200 'ok\n';
    }

    location /zinder.v1.wallet.WalletQuery/ {
      grpc_pass grpc://zinder_wallet;
    }

    location /zinder.v1.explorer.ExplorerQuery/ {
      grpc_pass grpc://zinder_explorer;
    }

    # Any other gRPC path is unsupported through this multiplexer.
    location / {
      default_type application/grpc;
      add_header grpc-status 12 always;
      add_header grpc-message "method not routable through zinder multiplexer" always;
      return 200;
    }
  }

  # HTTP/1.1 readiness proxy on 9098. zinder-ingest binds its ops port
  # to 127.0.0.1:9105 by default because /readyz may carry writer-
  # internal state that should not leave the box untraced. The single-
  # container deploy runs ingest, query, and explorer side by side, so
  # readiness is one loopback hop away; surfacing it on a routable port
  # lets a sibling BFF (e.g. zexplorer) read `canonical_lag_blocks` and
  # `ingest_phase` and compute a non-"unknown" sync-status chip without
  # opening ingest's ops endpoint to the world.
  server {
    listen 9098;
    listen [::]:9098;
    default_type text/plain;

    location = /readyz {
      proxy_pass http://zinder_ingest_ops/readyz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Local health for the PaaS to confirm this proxy itself is up.
    # Distinct from the gRPC multiplexer's /healthz on 9099.
    location = /healthz {
      return 200 'ok\n';
    }

    location / {
      return 404 'not found\n';
    }
  }
}
