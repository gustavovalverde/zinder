# Reference `zinder-explorer` configuration for the single-container image
# (mounted at /etc/zinder/explorer.toml).
#
# The explorer plane opens the writer-owned canonical store as its own
# RocksDB secondary under a distinct catchup directory so it never races
# with `zinder-query`'s secondary inside the same container. It serves
# the ExplorerQuery gRPC surface used by block-explorer clients (ADR-0009).
#
# zinder-explorer does NOT speak Zebra JSON-RPC, so this config has no
# [node] section. The reader-only stance also means no [ingest_control]
# section is needed: the explorer doesn't issue IngestControl RPCs.

[network]
name = "zcash-testnet"

[storage]
path = "/var/lib/zinder/store"
# Distinct secondary directory so the explorer never races zinder-query's
# secondary catchup inside the same container.
secondary_path = "/var/lib/zinder/explorer-secondary"
secondary_catchup_interval_ms = 1000

# Bounded RocksDB resource budgets for reader secondaries.
# See docs/adrs/0020-bounded-rocksdb-resource-budget.md.
[storage.canonical.rocksdb]
block_cache_bytes = 134217728
max_wal_bytes = 33554432
max_open_files = 128
write_buffer_bytes = 8388608
max_write_buffer_count = 2

[storage.derive.rocksdb]
block_cache_bytes = 67108864
max_wal_bytes = 16777216
max_open_files = 64
write_buffer_bytes = 4194304
max_write_buffer_count = 2

[explorer]
listen_addr = "0.0.0.0:9068"
# Loopback because the wallet plane (zinder-query) runs in the same
# container's s6 supervision tree and binds 0.0.0.0:9101.
wallet_query_endpoint = "http://127.0.0.1:9101"

[ops]
listen_addr = "0.0.0.0:9069"

# Required because the listen addresses above bind unspecified/public
# interfaces. Zinder ships no server TLS (ADR-0006); the single-container
# image fronts these ports with its nginx multiplexer. Without this the
# binary refuses to start.
[security]
allow_public_bind = true
