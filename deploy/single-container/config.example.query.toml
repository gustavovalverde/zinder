# Reference `zinder-query` configuration for the single-container image
# (mounted at /etc/zinder/config.toml).
#
# The reader points at the in-process IngestControl writer over loopback;
# operators wanting cross-host topology should set `ingest_control.addr`
# to the writer's external URL and add a shared-secret bearer token
# (ADR-0006).

[network]
name = "zcash-testnet"

[node]
# Z3 in-network DNS. Mainnet uses port 8232; testnet/regtest use 18232.
json_rpc_addr = "http://zebra:18232"
request_timeout_secs = 30

[node.auth]
# Cookie auth is the default. Operators choose one source for the cookie:
#  - Mounted cookie file (Z3 binding): set ZINDER_NODE__AUTH__PATH=/var/run/auth/.cookie
#  - Inline cookie (PaaS / Railway):   set ZINDER_NODE__AUTH__COOKIE=<cookie content>
# `path` and `cookie` are mutually exclusive, so leave the file source out of
# the TOML and let the deployment env declare exactly one.
method = "cookie"

[storage]
path = "/var/lib/zinder/store"
secondary_path = "/var/lib/zinder/secondary"

[ingest_control]
addr = "http://zinder-ingest:9100"

[query]
listen_addr = "0.0.0.0:9101"

[query.grpc]
enable_reflection = true
enable_health = true
