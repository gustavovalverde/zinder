# Reference `zinder-ingest` configuration (mounted at
# /etc/zinder/config.toml in the single-container image).
#
# Each binary strict-parses its own TOML schema (deny_unknown_fields), so the
# writer and reader live in separate files. When attaching to a Z3 stack
# (https://github.com/ZcashFoundation/z3) via the published platform
# contract, prefer the mounted-cookie path (no secrets to inject by hand):
#
#   docker run \
#     --network z3-testnet \
#     -v z3-testnet-cookie:/var/run/auth:ro \
#     ...
#
# For PaaS environments without a shared cookie volume, inject the cookie
# content as an env var (ZINDER_NODE__AUTH__METHOD=cookie,
# ZINDER_NODE__AUTH__COOKIE=<cookie-content>) instead.

[network]
name = "zcash-testnet"

[node]
# Z3 in-network DNS. JSON-RPC: 8232 (mainnet) / 18232 (testnet).
# Zebra indexer gRPC: 8230 (mainnet) / 18230 (testnet).
json_rpc_addr = "http://zebra:18232"
indexer_grpc_addr = "http://zebra:18230"
request_timeout_secs = 30
max_response_bytes = 67108864

[node.auth]
# Cookie auth is the default. Operators choose one source for the cookie:
#  - Mounted cookie file (Z3 binding): set ZINDER_NODE__AUTH__PATH=/var/run/auth/.cookie
#  - Inline cookie (PaaS / Railway):   set ZINDER_NODE__AUTH__COOKIE=<cookie content>
# `path` and `cookie` are mutually exclusive, so leave the file source out of
# the TOML and let the deployment env declare exactly one.
method = "cookie"

[storage]
path = "/var/lib/zinder/store"

[ingest]
source = "zebra-json-rpc"
reorg_window_blocks = 100

[ingest.derive]
replay_batch_blocks = 500
replay_policy = "canonical-first"
memory_degrade_ratio = 0.90
memory_pause_ratio = 0.99
memory_resume_ratio = 0.80
min_replay_batch_blocks = 50

[ingest.commitment_root_backfill]
# Historical root enrichment is resumable and does not gate wallet readiness.
enabled = true
batch_blocks = 256
fetch_concurrency = 8

[ingest.conventional_fee_distribution_backfill]
# Historical ZIP-317 conventional-fee distribution is resumable and does not gate readiness.
enabled = true
batch_blocks = 256

[ingest.paid_fee_distribution_backfill]
# Seed exact paid fees at the live boundary, then prepend settled history.
enabled = true
batch_blocks = 256
fetch_concurrency = 8
history_days = 365
timestamp_safety_seconds = 7200

[ingest.transaction_component_backfill]
# Historical transaction-component projection is resumable and does not gate readiness.
enabled = true
batch_blocks = 256

[ingest.transaction_history_verifier]
# Canonical transaction-history verification is resumable and does not gate readiness.
enabled = true
batch_blocks = 256

[ingest.value_pool_flow_backfill]
# Seed the live flow tail and reconstruct source-backed historical events.
enabled = true
batch_blocks = 256
fetch_concurrency = 8

[ingest.value_pool_balance_backfill]
# Scan canonical heights while fetching only UTC-day candidates and live-tail blocks.
enabled = true
batch_blocks = 10000
fetch_concurrency = 8

# Bulk-catchup runs on cold stores and after long downtime; the unified
# loop bounces back when the gap closes through the threshold.
[ingest.bulk_catchup]
canonical_batch_max_blocks = 1000
canonical_batch_max_artifact_bytes = 536870912
canonical_batch_max_estimated_write_bytes = 536870912
canonical_batch_min_blocks_before_estimated_write_close = 100
# Source-fetch and block-preparation limits resolve from the container memory,
# logical CPU count, and node response cap. Set individual fields only for a
# measured diagnostic override.
commit_reassembly_max_queued_artifact_bytes = 536870912

[ingest.tip_follow]
poll_interval_ms = 2000

[ingest_control]
listen_addr = "0.0.0.0:9100"

# Required because the listen addresses above bind unspecified/public
# interfaces. Zinder ships no server TLS (ADR-0006); the single-container
# image fronts these ports with its nginx multiplexer. Without this the
# binary refuses to start.
[security]
allow_public_bind = true
