# Clean version-1 wallet lifecycle certification against an existing Zebra.
#
# This topology never mounts Zebra's chain volume. It joins Zebra's external
# network and mounts only the authentication cookie read-only. Every Zinder and
# PostgreSQL data volume is project-scoped and disposable.
name: ${ZINDER_WALLET_LIFECYCLE_PROJECT_NAME:-zinder-wallet-lifecycle-test}

x-lifecycle-runner: &lifecycle-runner
  image: ${ZINDER_WALLET_LIFECYCLE_IMAGE:-zinder-wallet-lifecycle:local}
  user: "${ZINDER_WALLET_LIFECYCLE_UID:-1000}:${ZINDER_WALLET_LIFECYCLE_GID:-1000}"
  init: true
  read_only: true
  restart: "no"
  cpus: ${ZINDER_WALLET_LIFECYCLE_CPUS:-8.0}
  mem_limit: ${ZINDER_WALLET_LIFECYCLE_MEMORY_LIMIT_BYTES:-17179869184}
  entrypoint: ["/usr/local/bin/zinder-wallet-lifecycle"]
  environment: &lifecycle-environment
    RUST_LOG: ${RUST_LOG:-info}
    ZINDER_NETWORK: ${ZINDER_NETWORK:-zcash-testnet}
    ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:-http://zebra:18232}
    ZINDER_NODE__AUTH__METHOD: cookie
    ZINDER_NODE__AUTH__PATH: /var/run/zebra-auth/.cookie
    ZINDER_NODE__REQUEST_TIMEOUT_SECS: ${ZINDER_NODE__REQUEST_TIMEOUT_SECS:-30}
    ZINDER_NODE__MAX_RESPONSE_BYTES: ${ZINDER_NODE__MAX_RESPONSE_BYTES:-67108864}
  tmpfs:
    - /tmp:size=${ZINDER_WALLET_LIFECYCLE_TMPFS_SIZE:-1g},mode=1777
  volumes:
    - type: bind
      source: ${ZINDER_WALLET_LIFECYCLE_EVIDENCE_PATH:-../.tmp/wallet-lifecycle-evidence}
      target: /var/lib/zinder-evidence
      bind:
        create_host_path: false
    - type: volume
      source: source_cookie
      target: /var/run/zebra-auth
      read_only: true
      volume:
        nocopy: true

services:
  rocksdb-state-init:
    image: ${ZINDER_WALLET_LIFECYCLE_INIT_IMAGE:-debian:bookworm-slim}
    profiles: [rocksdb]
    user: "0:0"
    restart: "no"
    command:
      - chown
      - -R
      - ${ZINDER_WALLET_LIFECYCLE_UID:-1000}:${ZINDER_WALLET_LIFECYCLE_GID:-1000}
      - /var/lib/zinder-canonical
      - /var/lib/zinder-wallet
    volumes:
      - type: volume
        source: rocksdb_canonical
        target: /var/lib/zinder-canonical
        volume:
          nocopy: true
      - type: volume
        source: rocksdb_wallet
        target: /var/lib/zinder-wallet
        volume:
          nocopy: true

  rocksdb-certify:
    <<: *lifecycle-runner
    profiles: [rocksdb]
    depends_on:
      rocksdb-state-init:
        condition: service_completed_successfully
    networks: [source]
    volumes:
      - type: bind
        source: ${ZINDER_WALLET_LIFECYCLE_EVIDENCE_PATH:-../.tmp/wallet-lifecycle-evidence}
        target: /var/lib/zinder-evidence
        bind:
          create_host_path: false
      - type: volume
        source: source_cookie
        target: /var/run/zebra-auth
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: rocksdb_canonical
        target: /var/lib/zinder-canonical
        volume:
          nocopy: true
      - type: volume
        source: rocksdb_wallet
        target: /var/lib/zinder-wallet
        volume:
          nocopy: true
    command:
      - certify
      - --contract-version
      - "1"
      - --topology
      - rocksdb-single-host
      - --canonical-schema-version
      - "1"
      - --wallet-schema-version
      - "1"
      - --canonical-path
      - /var/lib/zinder-canonical
      - --wallet-path
      - /var/lib/zinder-wallet
      - --start-height
      - ${ZINDER_WALLET_LIFECYCLE_START_HEIGHT:-0}
      - --publication-epoch-id
      - "1"
      - --publication-event-sequence
      - "1"
      - --report
      - /var/lib/zinder-evidence/rocksdb-certification.json

  rocksdb-restart-certify:
    <<: *lifecycle-runner
    profiles: [rocksdb]
    networks: [source]
    volumes:
      - type: bind
        source: ${ZINDER_WALLET_LIFECYCLE_EVIDENCE_PATH:-../.tmp/wallet-lifecycle-evidence}
        target: /var/lib/zinder-evidence
        bind:
          create_host_path: false
      - type: volume
        source: source_cookie
        target: /var/run/zebra-auth
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: rocksdb_canonical
        target: /var/lib/zinder-canonical
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: rocksdb_wallet
        target: /var/lib/zinder-wallet
        read_only: true
        volume:
          nocopy: true
    command:
      - certify-restart
      - --contract-version
      - "1"
      - --topology
      - rocksdb-single-host
      - --canonical-path
      - /var/lib/zinder-canonical
      - --wallet-path
      - /var/lib/zinder-wallet
      - --prior-report
      - /var/lib/zinder-evidence/rocksdb-certification.json
      - --report
      - /var/lib/zinder-evidence/rocksdb-restart.json

  postgres-database:
    image: ${ZINDER_WALLET_LIFECYCLE_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296}
    profiles: [postgres]
    restart: "no"
    cpus: ${ZINDER_WALLET_LIFECYCLE_POSTGRES_CPUS:-6.0}
    mem_limit: ${ZINDER_WALLET_LIFECYCLE_POSTGRES_MEMORY_LIMIT_BYTES:-8589934592}
    shm_size: ${ZINDER_WALLET_LIFECYCLE_POSTGRES_SHARED_MEMORY_SIZE:-2g}
    stop_grace_period: 2m
    networks: [database]
    environment:
      POSTGRES_DB: zinder
      POSTGRES_USER: zinder_lifecycle
      POSTGRES_PASSWORD: zinder_lifecycle_local_only
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
        volume:
          nocopy: true
    tmpfs:
      - /tmp:size=${ZINDER_WALLET_LIFECYCLE_POSTGRES_TMPFS_SIZE:-512m},mode=1777
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=${ZINDER_WALLET_LIFECYCLE_POSTGRES_MAX_WAL_SIZE:-16GB}
      - -c
      - shared_buffers=${ZINDER_WALLET_LIFECYCLE_POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - maintenance_work_mem=${ZINDER_WALLET_LIFECYCLE_POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      start_period: 10s
      retries: 60

  postgres-certify:
    <<: *lifecycle-runner
    profiles: [postgres]
    depends_on:
      postgres-database:
        condition: service_healthy
    networks: [source, database]
    environment:
      <<: *lifecycle-environment
      ZINDER_POSTGRES_DATABASE_URL: postgresql://zinder_lifecycle:zinder_lifecycle_local_only@postgres-database:5432/zinder
    command:
      - certify
      - --contract-version
      - "1"
      - --topology
      - postgres-scale-out
      - --canonical-schema-version
      - "1"
      - --wallet-schema-version
      - "1"
      - --database-url-env
      - ZINDER_POSTGRES_DATABASE_URL
      - --canonical-schema
      - canonical
      - --wallet-schema
      - wallet
      - --start-height
      - ${ZINDER_WALLET_LIFECYCLE_START_HEIGHT:-0}
      - --publication-epoch-id
      - "1"
      - --publication-event-sequence
      - "1"
      - --report
      - /var/lib/zinder-evidence/postgres-certification.json

  postgres-restart-certify:
    <<: *lifecycle-runner
    profiles: [postgres]
    depends_on:
      postgres-database:
        condition: service_healthy
    networks: [database]
    environment:
      <<: *lifecycle-environment
      ZINDER_POSTGRES_DATABASE_URL: postgresql://zinder_lifecycle:zinder_lifecycle_local_only@postgres-database:5432/zinder
    command:
      - certify-restart
      - --contract-version
      - "1"
      - --topology
      - postgres-scale-out
      - --database-url-env
      - ZINDER_POSTGRES_DATABASE_URL
      - --canonical-schema
      - canonical
      - --wallet-schema
      - wallet
      - --prior-report
      - /var/lib/zinder-evidence/postgres-certification.json
      - --report
      - /var/lib/zinder-evidence/postgres-restart.json

volumes:
  rocksdb_canonical:
  rocksdb_wallet:
  postgres_data:
  source_cookie:
    external: true
    name: ${ZINDER_SOURCE_COOKIE_VOLUME_NAME:-z3-testnet-cookie}

networks:
  source:
    external: true
    name: ${ZINDER_SOURCE_NETWORK_NAME:-z3-testnet}
  database:
    internal: true
