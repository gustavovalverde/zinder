# zinder-query config. Tracked example; safe to edit. Docker Compose
# mounts this file at /etc/zinder/config.toml.
#
# Env vars from deploy/.env.<network> (loaded via `--env-file`) override
# anything below.

[network]
name = "zcash-mainnet"

[node]
json_rpc_addr = "http://zebra:8232"
request_timeout_secs = 30
broadcast_timeout_secs = 7

[node.auth]
method = "cookie"
path = "/var/run/auth/.cookie"

[storage]
path = "/var/lib/zinder/store"
secondary_path = "/var/lib/zinder/secondary"
secondary_catchup_interval_ms = 1000

# Bounded RocksDB resource budgets for reader secondaries.
# block_cache_bytes and max_open_files for the canonical reader are derived at
# startup from the container memory budget (cgroup v2), so they are omitted
# here. Direct I/O is always on for readers; the ADR-0020 store-size-
# independence invariant requires it. Override only when Railway's reported
# limit differs from the actual container limit.
# See docs/adrs/0020-bounded-rocksdb-resource-budget.md.
[storage.canonical.rocksdb]
max_wal_bytes = 33554432
write_buffer_bytes = 8388608
max_write_buffer_count = 2

[storage.derive.rocksdb]
block_cache_bytes = 67108864
max_wal_bytes = 16777216
max_open_files = 64
write_buffer_bytes = 4194304
max_write_buffer_count = 2

[ingest_control]
addr = "http://zinder-ingest:9100"

[query]
listen_addr = "0.0.0.0:9101"

[query.grpc]
enable_reflection = true
enable_health = true
