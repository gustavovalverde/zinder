# ExplorerQuery reader configuration for the optional Compose overlay.

[network]
name = "zcash-mainnet"

[node]
json_rpc_addr = "http://zebra:8232"
request_timeout_secs = 30

[node.auth]
method = "cookie"
path = "/var/run/auth/.cookie"

[storage]
path = "/var/lib/zinder/canonical"
secondary_path = "/var/lib/zinder/explorer/secondary"

[explorer]
listen_addr = "127.0.0.1:9068"
wallet_query_endpoint = "http://127.0.0.1:9102"
# Set when the WalletQuery endpoint enforces its private-control bearer token.
# wallet_query_bearer_token_path = "/var/run/auth/wallet-query.token"

[ops]
listen_addr = "127.0.0.1:9069"

[security]
allow_public_bind = false
