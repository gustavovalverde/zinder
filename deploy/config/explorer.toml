# zinder-explorer config. Tracked example; safe to edit. Docker Compose
# mounts this file at /etc/zinder/config.toml.
#
# zinder-explorer is the third long-lived service in the zinder stack
# (alongside zinder-ingest and zinder-query). It opens the writer-owned
# derive store as a RocksDB secondary under the canonical store path on the
# same per-network data volume (`zinder-<network>-data`) and serves the
# ExplorerQuery gRPC surface that block-explorer clients consume.

[network]
name = "zcash-mainnet"

[storage]
path = "/var/lib/zinder/store"
secondary_path = "/var/lib/zinder/explorer-secondary"

# Bounded RocksDB resource budgets for the canonical and derive secondaries.
# See docs/adrs/0020-bounded-rocksdb-resource-budget.md.
# [storage.canonical.rocksdb]
# block_cache_bytes = 536870912
# max_wal_bytes = 268435456
# max_open_files = 512
# write_buffer_bytes = 16777216
# max_write_buffer_count = 2
#
# [storage.derive.rocksdb]
# block_cache_bytes = 134217728
# max_wal_bytes = 67108864
# max_open_files = 256
# write_buffer_bytes = 8388608
# max_write_buffer_count = 2

[explorer]
listen_addr = "0.0.0.0:9068"
# The explorer plane delegates some reads to the wallet plane through
# the in-network DNS name the query service publishes. ADR-0009 records
# this co-located topology.
wallet_query_endpoint = "http://zinder-query:9101"

[ops]
listen_addr = "0.0.0.0:9069"
