# zinder-ingest config. Tracked example; safe to edit. Docker Compose
# mounts this file at /etc/zinder/config.toml.
#
# Env vars from deploy/.env.<network> (loaded via `--env-file`) override
# anything below. The defaults here target Z3 mainnet and match what
# `docker compose up` (without --env-file) produces.

[network]
name = "zcash-mainnet"

[node]
json_rpc_addr = "http://zebra:8232"
indexer_grpc_addr = "http://zebra:8230"
request_timeout_secs = 30
max_response_bytes = 67108864

[node.auth]
method = "cookie"
path = "/var/run/auth/.cookie"

[storage]
path = "/var/lib/zinder/store"

# Bounded RocksDB resource budgets. Uncomment per role only when the host
# memory envelope requires a different budget.
# See docs/adrs/0020-bounded-rocksdb-resource-budget.md.
# [storage.canonical.rocksdb]
# block_cache_bytes = 536870912
# max_wal_bytes = 268435456
# max_open_files = 512
# write_buffer_bytes = 16777216
# max_write_buffer_count = 2
#
# [storage.derive.rocksdb]
# block_cache_bytes = 134217728
# max_wal_bytes = 67108864
# max_open_files = 256
# write_buffer_bytes = 8388608
# max_write_buffer_count = 2

[ingest]
source = "zebra-json-rpc"
reorg_window_blocks = 100

[ingest.derive]
# Derive replay is memory-bounded independently from canonical commit size.
replay_batch_blocks = 500
# Keep canonical fact writes ahead of rebuildable derive projections when the
# process approaches its cgroup memory budget.
replay_policy = "canonical-first"
memory_degrade_ratio = 0.90
memory_pause_ratio = 0.99
memory_resume_ratio = 0.80
min_replay_batch_blocks = 50

[ingest.bulk_catchup]
canonical_batch_max_blocks = 1000
canonical_batch_max_artifact_bytes = 536870912
canonical_batch_max_estimated_write_bytes = 536870912
canonical_batch_min_blocks_before_estimated_write_close = 100
source_segment_max_blocks = 16
source_segment_target_response_bytes = 33554432
source_fetch_max_in_flight_requests = 20
source_fetch_max_in_flight_bytes = 671088640
block_prepare_concurrency = 16
block_prepare_max_in_flight_artifact_bytes = 536870912
commit_reassembly_max_queued_artifact_bytes = 536870912
# Force a RocksDB flush every N committed epochs (≈ N × canonical_batch_max_blocks
# blocks). Caps the live WAL by writer cadence and bounds crash-recovery
# RAM. Default is 5; uncomment to override. See
# docs/runbooks/bulk-catchup-oom-recovery.md.
# flush_interval_epochs = 5

[ingest.tip_follow]
poll_interval_ms = 2000

[ingest_control]
listen_addr = "0.0.0.0:9100"

# Required because the listen addresses above bind unspecified/public
# interfaces. Zinder ships no server TLS (ADR-0006); front these ports with a
# reverse proxy. Without this the binary refuses to start.
[security]
allow_public_bind = true
