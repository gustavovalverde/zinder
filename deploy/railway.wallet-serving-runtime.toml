# Set this path as the wallet-serving service's config-as-code file and set
# RAILWAY_DOCKER_TARGET_STAGE=zinder-wallet-serving-runtime on that service.
# Without the service setting, Railway falls back to the repository-root
# railway.toml and builds the canonical canary image instead.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.railway-wallet-serving"

[deploy]
# The container is only useful once the native query surface serves, so the
# healthcheck window covers the canonical and wallet construction gates.
healthcheckPath = "/readyz"
healthcheckTimeout = 21600
restartPolicyType = "ALWAYS"
overlapSeconds = 0
# The entrypoint gives the three RocksDB openers 20 seconds to flush, so this
# must stay above that or the platform kills them mid-write.
drainingSeconds = 30
