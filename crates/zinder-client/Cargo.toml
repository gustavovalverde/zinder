[package]
name = "zinder-client"
version = "0.1.0"
description = "Typed Rust client surface for Zinder chain-index consumers"
edition.workspace = true
readme = "../../README.md"
keywords = ["zcash", "indexer", "client"]
categories = ["api-bindings"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tonic = { workspace = true, features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-types.workspace = true
tracing.workspace = true
zinder-core.workspace = true
zinder-derive.workspace = true
zinder-proto.workspace = true
zinder-source.workspace = true
zinder-store.workspace = true

[dev-dependencies]
eyre.workspace = true
secrecy.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "time"] }
toml.workspace = true
tonic = { workspace = true, features = ["server", "transport"] }
zebra-chain.workspace = true
zinder-compat-lightwalletd.workspace = true
zinder-query.workspace = true
zinder-testkit.workspace = true

[[example]]
name = "observe_transparent_address"
path = "examples/observe_transparent_address.rs"

[[example]]
name = "observe_mempool_to_confirmed"
path = "examples/observe_mempool_to_confirmed.rs"

[lints]
workspace = true
