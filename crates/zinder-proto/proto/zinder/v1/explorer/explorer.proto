syntax = "proto3";

package zinder.v1.explorer;

import "zinder/v1/ops/server_info.proto";
import "zinder/v1/wallet/wallet.proto";

// Explorer-plane server descriptor returned by `ExplorerQuery.ServerInfo`.
//
// `common` carries the cross-service identity, capability set, and
// deprecation metadata defined in [`zinder.v1.ops.ServerInfo`]. The
// `vendor` field is the only explorer-specific addition today.
message ExplorerServerInfo {
  // Cross-service identity and capability descriptor.
  zinder.v1.ops.ServerInfo common = 1;

  // Service vendor, always "Zinder".
  string vendor = 2;
}

// Server descriptor request.
message ServerInfoRequest {}

// Server descriptor response.
message ServerInfoResponse {
  ExplorerServerInfo info = 1;
}

// Per-field unavailability with structured reason and canonical text.
//
// Carried in `ExplorerFreshness.unavailable` so consumers can branch on
// the structured `reason` or render `human_reason` verbatim. The reason
// string comes from the canonical registry in
// `crates/zinder-core/src/explorer_reasons.rs`; the contract is defined in
// [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md).
message UnavailableField {
  // Dotted path matching the response field hierarchy, e.g.
  // `fee.computed.zip317_conventional_zat`.
  string field_path = 1;

  // Structured reason the field is absent.
  UnavailableReason reason = 2;

  // Canonical human-readable reason a UI can render verbatim.
  string human_reason = 3;
}

// Coarse classification of why an explorer field is absent.
enum UnavailableReason {
  UNAVAILABLE_REASON_UNSPECIFIED = 0;

  // Shielded by design; the value is private, not missing.
  UNAVAILABLE_PRIVATE_BY_DESIGN = 1;

  // Computation depends on prevouts that could not be resolved.
  UNAVAILABLE_PREVOUTS_MISSING = 2;

  // The upstream node does not expose the fact this field needs.
  UNAVAILABLE_UPSTREAM_NOT_SUPPORTED = 3;

  // The derived index does not yet contain this entity.
  UNAVAILABLE_NOT_INDEXED = 4;

  // Derived index is too far behind canonical to answer this view.
  UNAVAILABLE_STALE = 5;

  // The transaction includes sections the parser cannot decode.
  UNAVAILABLE_PARSER_VERSION_UNSUPPORTED = 6;
}

// Cross-cutting freshness envelope embedded on every explorer response
// (`field tag 1` by convention).
//
// Defined in [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md);
// every `ExplorerQuery` RPC's response carries this field tag 1 first so
// consumers can read `response.freshness` unconditionally.
message ExplorerFreshness {
  // Chain epoch the response was produced from.
  zinder.v1.wallet.ChainEpoch chain_epoch = 1;

  // Age of the mempool snapshot in milliseconds; zero for responses that
  // do not touch mempool state.
  uint64 snapshot_age_millis = 2;

  // How far behind canonical the explorer derive view is, in blocks.
  uint64 derive_cursor_lag_blocks = 3;

  // Wall-clock equivalent of `derive_cursor_lag_blocks` in milliseconds.
  uint64 derive_cursor_lag_millis = 4;

  // The capability string that produced this response. Lets clients branch
  // on which `_vN` was used to construct the response shape.
  string capability_version = 5;

  // Field-path-keyed unavailability entries.
  repeated UnavailableField unavailable = 6;
}

// Coarse transaction-format identifier.
//
// `effective_version` carries the integer version from
// [ZIP-225](https://zips.z.cash/zip-0225). `version_group_id` carries the
// raw `nVersionGroupId` for v3/v4/v5+ transactions. The discrete `kind`
// arm lets clients switch on a closed enum without parsing the integer.
enum TransactionVersionKind {
  TRANSACTION_VERSION_KIND_UNSPECIFIED = 0;
  TRANSACTION_VERSION_KIND_V1 = 1;
  TRANSACTION_VERSION_KIND_V2 = 2;
  TRANSACTION_VERSION_KIND_V3 = 3;
  TRANSACTION_VERSION_KIND_V4 = 4;
  TRANSACTION_VERSION_KIND_V5 = 5;
  TRANSACTION_VERSION_KIND_UNSUPPORTED = 6;
}

// Transaction-format identifier carried on the explorer wire.
message TransactionVersion {
  TransactionVersionKind kind = 1;
  uint32 effective_version = 2;
  optional uint32 version_group_id = 3;
}

// Coarse privacy classification computed by
// `zinder_core::classify_privacy_shape`.
enum PrivacyShape {
  PRIVACY_SHAPE_UNSPECIFIED = 0;
  PRIVACY_SHAPE_TRANSPARENT_ONLY = 1;
  PRIVACY_SHAPE_SHIELDING = 2;
  PRIVACY_SHAPE_DESHIELDING = 3;
  PRIVACY_SHAPE_SHIELDED_ONLY = 4;
  PRIVACY_SHAPE_MIXED = 5;
  PRIVACY_SHAPE_COINBASE = 6;
  PRIVACY_SHAPE_SHIELDED_COINBASE = 7;
  PRIVACY_SHAPE_UNCLASSIFIED = 8;
}

// Transaction lock-time classification.
//
// Mirrors `zinder_core::LockTime`: explicit `unlocked` marker, height-based
// lock time, or Unix-seconds lock time. The oneof is closed; clients
// switch on the present arm.
message LockTime {
  oneof kind {
    LockTimeUnlocked unlocked = 1;
    uint32 height = 2;
    uint64 unix_seconds = 3;
  }
}

// Discrete marker for the "no lock-time constraint" case.
message LockTimeUnlocked {}

// Component counts feeding the privacy classifier and the wire surface.
message TransactionComponentCounts {
  uint32 transparent_input_count = 1;
  uint32 transparent_output_count = 2;
  uint32 sapling_spend_count = 3;
  uint32 sapling_output_count = 4;
  uint32 orchard_action_count = 5;
  uint32 sprout_joinsplit_count = 6;
}

// Single typed value carrying every public fact the explorer renders for a
// transaction.
//
// Parsed once by `zinder_source::parse_transaction_public_facts` from raw
// transaction bytes plus the node-discovered network upgrade table per
// [ADR-0010](../../../../../docs/adrs/0010-transaction-public-facts.md).
message TransactionPublicFacts {
  // Canonical transaction identifier (32 bytes, internal byte order).
  bytes transaction_id = 1;

  // ZIP-244 authorization digest (32 bytes). Empty/unset for v1-v4.
  bytes auth_digest = 2;

  // ZIP-239 witness identifier (64 bytes, `txid || auth_digest`). Empty/unset
  // for v1-v4 where the wtxid equals the txid by definition.
  bytes wtxid = 3;

  // Coarse transaction-format identifier.
  TransactionVersion version = 4;

  // Consensus branch ID in the canonical 8-character lowercase hex form
  // (per the BIP70 / Zebra convention). Empty when not applicable (v1/v2).
  string consensus_branch_id_hex = 5;

  // Lock-time classification.
  LockTime lock_time = 6;

  // [ZIP-203](https://zips.z.cash/zip-0203) `nExpiryHeight` when present and
  // non-sentinel. Zero/unset means the transaction has no expiry.
  uint32 expiry_height = 7;

  // Raw transaction byte length.
  uint32 size_bytes = 8;

  // Component counts (transparent / Sapling / Orchard / Sprout).
  TransactionComponentCounts counts = 9;

  // Coarse privacy classification.
  PrivacyShape privacy_shape = 10;

  // `true` when the transaction is a coinbase row.
  bool is_coinbase = 11;
}

// Discriminated transaction location.
//
// A `TransactionDetail` response carries exactly one of `mined` or
// `in_mempool`. Transactions the indexer cannot locate at all surface as
// `Status::NOT_FOUND`, not as an empty `TransactionLocation`.
message TransactionLocation {
  oneof kind {
    MinedLocation mined = 1;
    MempoolLocation in_mempool = 2;
  }
}

// Mined-transaction location carrying block context the explorer page
// renders alongside the parsed facts.
message MinedLocation {
  uint32 block_height = 1;
  bytes block_hash = 2;
  int64 block_time_unix_seconds = 3;
  uint32 confirmations = 4;
}

// Mempool-transaction location carrying first-observation metadata.
message MempoolLocation {
  uint64 first_seen_unix_millis = 1;
  zinder.v1.wallet.ChainEpoch first_seen_chain_epoch = 2;
}

// `ExplorerQuery.TransactionDetail` request.
//
// `at_epoch` optionally pins the read to a specific chain epoch so the
// response stays consistent with a concurrent caller's other reads.
message TransactionDetailRequest {
  bytes transaction_id = 1;
  optional zinder.v1.wallet.ChainEpoch at_epoch = 2;
}

// `ExplorerQuery.TransactionDetail` response.
//
// Carries the cross-cutting freshness envelope plus the parsed public
// facts, location discriminator, and raw transaction bytes so consumers
// can keep parsed and raw forms together (per the PRD's user story 16).
message TransactionDetailResponse {
  ExplorerFreshness freshness = 1;
  TransactionPublicFacts facts = 2;
  TransactionLocation location = 3;
  bytes raw_transaction_bytes = 4;
}

// Compact summary of one canonical block.
//
// Materialized once at derive time and read back by both
// `ExplorerQuery.BlockSummariesInRange` (projection) and
// `ExplorerQuery.BlockDetail` (full record). See
// [Explorer plane §Block view shape](../../../../../docs/architecture/explorer-plane.md#block-view-shape).
message BlockSummary {
  // Canonical block height.
  uint32 block_height = 1;

  // Canonical block hash in internal byte order (32 bytes).
  bytes block_hash = 2;

  // `nTime` from the block header.
  int64 block_time_unix_seconds = 3;

  // Number of transactions in the block, including the coinbase.
  uint32 transaction_count = 4;

  // Previous block hash in internal byte order (32 bytes).
  bytes previous_block_hash = 5;
}

// Materialized storage record for the `BlockSummary` derive view.
//
// Not exposed by any RPC. Encoded once at derive time and read back by
// both `ExplorerQuery.BlockSummariesInRange` (projecting `summary`) and
// `ExplorerQuery.BlockDetail` (emitting `summary` plus `transaction_ids`).
// One record per canonical block, keyed by big-endian block height inside
// the consumer's `block_summary` column family.
message BlockSummaryRecord {
  BlockSummary summary = 1;
  // Transaction ids in canonical block order (32 bytes each, internal byte
  // order). The leading entry is the coinbase.
  repeated bytes transaction_ids = 2;
}

// `ExplorerQuery.BlockSummariesInRange` request.
//
// Returns one `BlockSummary` per canonical block in
// `[start_height, end_height]` inclusive, ordered by ascending height.
message BlockSummariesInRangeRequest {
  // First block height to return (inclusive).
  uint32 start_height = 1;

  // Last block height to return (inclusive).
  uint32 end_height = 2;

  // Optional chain-epoch pin for snapshot consistency with concurrent reads.
  optional zinder.v1.wallet.ChainEpoch at_epoch = 3;
}

// `ExplorerQuery.BlockSummariesInRange` response.
message BlockSummariesInRangeResponse {
  ExplorerFreshness freshness = 1;
  repeated BlockSummary summaries = 2;
}

// `ExplorerQuery.BlockDetail` request.
//
// Either `block_height` or `block_hash` resolves the target block. Hash
// lookups consult the upstream wallet plane's
// `WalletQuery.BlockIdBySelector` indirection so the derive store keeps a
// single height-keyed schema.
message BlockDetailRequest {
  oneof selector {
    uint32 block_height = 1;
    bytes block_hash = 2;
  }

  // Optional chain-epoch pin for snapshot consistency with concurrent reads.
  optional zinder.v1.wallet.ChainEpoch at_epoch = 3;
}

// `ExplorerQuery.BlockDetail` response.
//
// Carries the `BlockSummary` plus the canonical-ordered transaction ids the
// block committed. Clients render per-transaction rows by calling
// `ExplorerQuery.TransactionDetail` with each id; the v1 surface keeps
// per-transaction data out of the block-detail wire shape to avoid the
// fan-out cost of parsing every transaction at request time.
message BlockDetailResponse {
  ExplorerFreshness freshness = 1;
  BlockSummary summary = 2;

  // Transaction ids in canonical block order (32 bytes each, internal byte
  // order). The leading entry is the coinbase.
  repeated bytes transaction_ids = 3;
}

// Per-arm privacy refusal payload returned for shielded receivers,
// viewing keys, and shielded receivers within a unified address.
//
// The structured `reason` lets the UI branch on the refusal class while
// `human_reason` carries a canonical sentence the UI may render verbatim.
// `canonical_form` echoes the classified input when echoing is safe
// (e.g. a Sapling-encoded shielded address); it is omitted for viewing
// keys, where echoing would be a privacy regression.
message NotPubliclyIndexable {
  NotPubliclyIndexableReason reason = 1;
  string human_reason = 2;
  optional string canonical_form = 3;
}

// Discrete reason classes the explorer refuses public history for.
enum NotPubliclyIndexableReason {
  NOT_PUBLICLY_INDEXABLE_REASON_UNSPECIFIED = 0;

  // The input decoded as a shielded address (Sapling, Orchard, Sprout).
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_ADDRESS = 1;

  // The input decoded as a viewing key (UIVK, UFVK, Sapling extended
  // viewing key). Echoing the key in the response would itself be a
  // privacy regression, so `canonical_form` is omitted.
  NOT_PUBLICLY_INDEXABLE_REASON_VIEWING_KEY = 2;

  // The receiver inside a unified address is shielded. The enclosing
  // `UnifiedAddressMatch` may still route transparent receivers from the
  // same input.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_RECEIVER_IN_UNIFIED = 3;
}

// Block candidate produced when the input parses as a height or a
// 32-byte block hash that the upstream wallet confirms.
message BlockMatch {
  // Canonical block height of the resolved block.
  uint32 block_height = 1;

  // Canonical block hash in internal byte order (32 bytes).
  bytes block_hash = 2;
}

// Transaction candidate produced when the input parses as a 32-byte
// transaction id that the upstream wallet confirms.
//
// Mined transactions carry block-context fields; mempool transactions
// populate only the transaction id.
message TransactionMatch {
  // Canonical transaction id (32 bytes, internal byte order).
  bytes transaction_id = 1;

  // True when the transaction is currently in the mempool.
  bool in_mempool = 2;

  // Populated when the transaction is mined; zero for mempool entries.
  uint32 mined_block_height = 3;

  // Populated when the transaction is mined; empty for mempool entries.
  bytes mined_block_hash = 4;
}

// Transparent (P2PKH or P2SH) address candidate.
//
// The classifier verifies that the input parses as a valid Zcash
// transparent address on the configured network; existence of on-chain
// history is not asserted.
message TransparentAddressMatch {
  // Canonical base58check form of the address.
  string canonical_form = 1;

  // SHA-256 of the canonical scriptPubKey, in 32-byte form. Matches the
  // `script_hash` selector accepted by every transparent-address request.
  bytes address_script_hash = 2;

  // True for P2PKH; false for P2SH.
  bool is_p2pkh = 3;
}

// ZIP-320 TEX address candidate.
//
// The classifier extracts the underlying P2PKH hash and re-encodes
// both the canonical `tex1.../textest1...` form and the equivalent
// `t1.../tm...` P2PKH form so the UI can link directly to the
// transparent-address page.
message TexAddressMatch {
  // Canonical Bech32m `tex1.../textest1...` form.
  string canonical_tex_form = 1;

  // Equivalent `t1.../tm...` P2PKH form that drives indexable history.
  string equivalent_p2pkh_form = 2;

  // Routable transparent match the UI can link to for history.
  TransparentAddressMatch transparent = 3;

  // Always `true`: TEX addresses constrain the sender to transparent
  // inputs only; on-chain the output is indistinguishable from the
  // underlying P2PKH.
  bool transparent_source_only = 4;

  // Canonical reason a UI may render verbatim.
  string spend_side_note = 5;
}

// ZIP-316 unified address candidate.
//
// The classifier decodes the receiver typecodes and surfaces each
// receiver as its own routing hint; transparent receivers carry a
// `TransparentAddressMatch`, while shielded receivers carry the typed
// `NotPubliclyIndexable` refusal.
message UnifiedAddressMatch {
  // Original Bech32m encoding of the input.
  string canonical_form = 1;

  // Network the unified address belongs to ("zcash-mainnet",
  // "zcash-testnet", "zcash-regtest"), matching the wire vocabulary in
  // `zinder.v1.ops.ServerInfo.network`.
  string network = 2;

  // One entry per ZIP-316 receiver typecode present in the unified
  // address, in the order declared by the encoding.
  repeated UnifiedAddressReceiver receivers = 3;
}

// Per-receiver routing inside a unified address.
message UnifiedAddressReceiver {
  UnifiedAddressReceiverKind kind = 1;
  oneof body {
    TransparentAddressMatch transparent = 2;
    NotPubliclyIndexable shielded = 4;
  }
}

// ZIP-316 receiver typecodes the classifier recognizes.
enum UnifiedAddressReceiverKind {
  UNIFIED_ADDRESS_RECEIVER_KIND_UNSPECIFIED = 0;

  // P2PKH transparent receiver (typecode 0x00).
  UNIFIED_ADDRESS_RECEIVER_KIND_P2PKH = 1;

  // P2SH transparent receiver (typecode 0x01).
  UNIFIED_ADDRESS_RECEIVER_KIND_P2SH = 2;

  // Sapling shielded receiver (typecode 0x02).
  UNIFIED_ADDRESS_RECEIVER_KIND_SAPLING = 3;

  // Orchard shielded receiver (typecode 0x03).
  UNIFIED_ADDRESS_RECEIVER_KIND_ORCHARD = 4;

  // Receiver typecode the classifier does not recognize. The receiver
  // body carries a `NotPubliclyIndexable` shape with
  // `UNAVAILABLE_PARSER_VERSION_UNSUPPORTED` semantics.
  UNIFIED_ADDRESS_RECEIVER_KIND_UNKNOWN = 5;
}

// Shielded-address candidate. The classifier always routes this arm
// through `NotPubliclyIndexable`; no storage call is ever issued.
message ShieldedAddressMatch {
  NotPubliclyIndexable not_publicly_indexable = 1;
}

// Viewing-key candidate. The classifier never echoes the key bytes,
// because doing so on the response surface would itself be a privacy
// regression even when the server never persists the key.
message ViewingKeyMatch {
  NotPubliclyIndexable not_publicly_indexable = 1;
}

// Payment-disclosure payload candidate. Reserved for the future
// payment-disclosure verifier; classified but not implemented in v1.
message PaymentDisclosureMatch {
  // Hint string a UI may render explaining the reserved state.
  string hint = 1;
}

// Catch-all candidate when no other arm classifies the input.
message UnclassifiedMatch {
  // Operator-readable hint explaining what the classifier expected.
  string hint = 1;
}

// One classified search candidate. Exactly one `match` arm is populated.
message SearchCandidate {
  oneof match {
    BlockMatch block = 1;
    TransactionMatch transaction = 2;
    TransparentAddressMatch transparent_address = 3;
    TexAddressMatch tex_address = 4;
    UnifiedAddressMatch unified_address = 5;
    ShieldedAddressMatch shielded_address = 6;
    ViewingKeyMatch viewing_key = 7;
    PaymentDisclosureMatch payment_disclosure = 8;
    UnclassifiedMatch unclassified = 9;
  }

  // Heuristic confidence in `[0.0, 1.0]`. `1.0` means the classifier is
  // structurally certain (e.g. address parsed cleanly); lower values
  // mean the arm is one of several plausible interpretations of the
  // same input (e.g. a short numeric string matches both a height and
  // the prefix of a possible txid).
  float confidence = 10;
}

// `ExplorerQuery.Search` request.
message SearchRequest {
  // Raw user input. Capped at 4 KiB on the server side; longer payloads
  // (e.g. ZIP-321 URIs, payment disclosures) are routed to dedicated
  // RPCs once those surfaces ship.
  string query = 1;
}

// `ExplorerQuery.Search` response. One request produces zero or more
// typed candidates; the UI renders the highest-confidence arm first.
message SearchResponse {
  ExplorerFreshness freshness = 1;
  repeated SearchCandidate candidates = 2;
}

// Per-shape count carried by [`MempoolSummaryResponse`].
message PrivacyShapeCount {
  PrivacyShape shape = 1;
  uint32 count = 2;
}

// Per-version count carried by [`MempoolSummaryResponse`].
message TransactionVersionCount {
  TransactionVersionKind kind = 1;
  uint32 count = 2;
}

// `ExplorerQuery.MempoolSummary` request.
//
// Optionally pins the read to a specific chain epoch so the response
// stays consistent with concurrent reads.
message MempoolSummaryRequest {
  optional zinder.v1.wallet.ChainEpoch at_epoch = 1;
}

// `ExplorerQuery.MempoolSummary` response.
//
// Aggregates the current mempool snapshot into a single page-friendly
// shape: total counts, byte size, privacy-shape distribution, version
// distribution, and freshness extremes. The handler parses every entry
// via `zinder_source::parse_transaction_public_facts` so the shape and
// version classifiers stay in lockstep with `TransactionDetail`.
message MempoolSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Number of transactions in the snapshot.
  uint32 transaction_count = 2;

  // Sum of `size_bytes` across every entry.
  uint64 total_size_bytes = 3;

  // One entry per privacy shape present in the snapshot; shapes with
  // zero entries are omitted.
  repeated PrivacyShapeCount privacy_shape_distribution = 4;

  // One entry per transaction version kind present in the snapshot;
  // versions with zero entries are omitted.
  repeated TransactionVersionCount version_distribution = 5;

  // Age of the oldest mempool entry (largest `first_seen_unix_millis`
  // delta vs. now). Zero when the snapshot is empty.
  uint64 oldest_entry_age_millis = 6;

  // Age of the newest mempool entry (smallest `first_seen_unix_millis`
  // delta vs. now). Zero when the snapshot is empty.
  uint64 newest_entry_age_millis = 7;
}

// `ExplorerQuery.MempoolActivity` request.
//
// Returns the current mempool entries sorted by newest-first observation
// time. The cursor is opaque and encodes the prior page's last entry so
// subsequent calls resume past it. Mempool state is transient; restarted
// pages may return new entries that arrived since the prior call.
message MempoolActivityRequest {
  uint32 max_entries = 1;
  bytes from_cursor = 2;
}

// One mempool entry projected into the explorer wire shape.
message MempoolActivityEntry {
  // Canonical transaction identifier (32 bytes, internal byte order).
  bytes transaction_id = 1;

  // Wall-clock time when the indexer first observed this entry.
  uint64 first_seen_unix_millis = 2;

  // Raw transaction byte length.
  uint32 size_bytes = 3;

  // Coarse privacy classification computed from the parsed facts.
  PrivacyShape privacy_shape = 4;

  // Coarse transaction version classification.
  TransactionVersion version = 5;
}

// `ExplorerQuery.MempoolActivity` response.
message MempoolActivityResponse {
  ExplorerFreshness freshness = 1;
  repeated MempoolActivityEntry entries = 2;
  bytes next_cursor = 3;
}

// `ExplorerQuery.TransparentAddressActivity` request.
//
// Composes the canonical transparent-address history surface with the
// live mempool overlay so a single call returns confirmed history and
// pending entries together. Mempool entries appear before confirmed
// entries when `descending=true`; the mempool overlay is included only
// on the first page (`from_cursor` empty) so subsequent pages do not
// re-emit transient state.
message TransparentAddressActivityRequest {
  // Selector for the transparent address being queried.
  zinder.v1.wallet.AddressLookup address = 1;

  // Inclusive minimum block height for the confirmed slice. Zero means
  // start from genesis.
  uint32 start_height = 2;

  // Inclusive maximum block height for the confirmed slice.
  uint32 end_height = 3;

  // Server-bounded maximum entries per page (confirmed + mempool).
  // Zero means use the server default; values larger than the
  // server's configured cap are silently clamped.
  uint32 max_entries = 4;

  // Empty resumes from the head of the requested direction. Non-empty
  // resumes strictly after the prior page's last confirmed entry; the
  // cursor's encoded direction is authoritative.
  bytes from_cursor = 5;

  // Iterate newest-first when true.
  bool descending = 6;

  // Include unmined mempool entries on the first page. Has no effect on
  // subsequent pages so the wire shape does not re-emit transient state.
  bool include_mempool = 7;

  // Optional chain epoch pin for the confirmed slice.
  optional zinder.v1.wallet.ChainEpoch at_epoch = 8;
}

// One transparent-address activity row.
//
// Unifies confirmed history rows (carrying `block_height`, `block_hash`,
// `tx_index_in_block`) with mempool rows (`in_mempool=true`, carrying
// `first_seen_unix_millis`). The two arms never coexist on one entry.
message TransparentAddressActivityEntry {
  // Canonical transaction identifier.
  bytes transaction_id = 1;

  // Zero when `in_mempool=true`; otherwise the canonical block height
  // of the confirming block.
  uint32 block_height = 2;

  // Empty when `in_mempool=true`; otherwise the canonical block hash.
  bytes block_hash = 3;

  // Zero when `in_mempool=true`; otherwise the canonical position of
  // the transaction inside its block.
  uint32 tx_index_in_block = 4;

  // True for mempool entries; the confirmed-slice fields are zero.
  bool in_mempool = 5;

  // Zero unless `in_mempool=true`; wall-clock time when the indexer
  // first observed the mempool entry funding this address.
  uint64 first_seen_unix_millis = 6;
}

// `ExplorerQuery.TransparentAddressActivity` response.
message TransparentAddressActivityResponse {
  ExplorerFreshness freshness = 1;
  repeated TransparentAddressActivityEntry entries = 2;
  bytes next_cursor = 3;
}

// `ExplorerQuery.FeeSummary` request.
//
// Aggregates per-transaction ZIP-317 conventional fee floors over the
// inclusive block range `[start_height, end_height]`. The handler parses
// every block via `WalletQuery.FullBlock` and computes
// `zinder_core::TransactionComponentCounts::zip317_conventional_fee_zat`
// for each non-coinbase transaction.
message FeeSummaryRequest {
  uint32 start_height = 1;
  uint32 end_height = 2;
  optional zinder.v1.wallet.ChainEpoch at_epoch = 3;
}

// `ExplorerQuery.FeeSummary` response.
//
// The fee fields are ZIP-317 conventional fee floors, not miner-collected
// fees. Computing actual fees requires prevout resolution and is
// intentionally out of scope for `v1`; the conventional-fee floor is the
// minimum a wallet should attach to a transaction with the given shape.
message FeeSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Number of canonical blocks the response aggregated.
  uint32 block_count = 2;

  // Number of non-coinbase transactions across the aggregated range.
  // Coinbase transactions are excluded because they have no fee.
  uint32 transaction_count = 3;

  // Sum of `zip317_conventional_fee_zat` across every non-coinbase
  // transaction.
  uint64 total_zip317_conventional_fee_zat = 4;

  // Smallest `zip317_conventional_fee_zat` observed across the range,
  // zero when the range carries no non-coinbase transactions.
  uint64 min_zip317_conventional_fee_zat = 5;

  // Largest `zip317_conventional_fee_zat` observed across the range,
  // zero when the range carries no non-coinbase transactions.
  uint64 max_zip317_conventional_fee_zat = 6;
}

// Explorer-shaped read surface served by zinder-explorer.
service ExplorerQuery {
  // Returns the consumer-side capability descriptor.
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);

  // Returns a typed read model for one transaction. Capability:
  // `explorer.transaction.detail_v1`.
  rpc TransactionDetail(TransactionDetailRequest)
      returns (TransactionDetailResponse);

  // Returns one `BlockSummary` per canonical block in the requested
  // height range, ordered by ascending height. Capability:
  // `explorer.block.summary_v1`.
  rpc BlockSummariesInRange(BlockSummariesInRangeRequest)
      returns (BlockSummariesInRangeResponse);

  // Returns one `BlockSummary` plus the canonical-ordered transaction ids
  // for the requested block. Capability: `explorer.block.detail_v1`.
  rpc BlockDetail(BlockDetailRequest) returns (BlockDetailResponse);

  // Returns the transparent-address balance summed across the requested
  // addresses. Capability: `explorer.transparent_address.balance_v1`.
  // Federated to consumers under `WalletQuery.TransparentAddressBalance`;
  // the wire shape and compute path are identical between the two surfaces.
  rpc TransparentAddressBalance(zinder.v1.wallet.TransparentAddressBalanceRequest)
      returns (zinder.v1.wallet.TransparentAddressBalanceResponse);

  // Classifies a raw user input string into typed search candidates per
  // [ADR-0012](../../../../../docs/adrs/0012-typed-explorer-search-and-privacy-refusal.md).
  // Shielded receivers, viewing keys, and shielded receivers inside
  // unified addresses route to the typed `NotPubliclyIndexable` arm and
  // never reach a storage read. Capability: `explorer.search_v1`.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Aggregates the current mempool snapshot into a single explorer-shaped
  // response: total counts, byte size, privacy-shape distribution,
  // version distribution, and freshness extremes. Capability:
  // `explorer.mempool.summary_v1`.
  rpc MempoolSummary(MempoolSummaryRequest) returns (MempoolSummaryResponse);

  // Returns the current mempool entries sorted by newest-first
  // observation time, paged with an opaque cursor. Mempool state is
  // transient; subsequent pages may interleave with new arrivals.
  // Capability: `explorer.mempool.activity_v1`.
  rpc MempoolActivity(MempoolActivityRequest) returns (MempoolActivityResponse);

  // Returns confirmed transparent-address history paged with the live
  // mempool overlay. Confirmed rows page via the same cursor semantics
  // as `WalletQuery.TransparentAddressTxIdsInRange`; mempool entries are
  // emitted only on the first page when `include_mempool=true`.
  // Capability: `explorer.transparent_address.activity_v1`.
  rpc TransparentAddressActivity(TransparentAddressActivityRequest)
      returns (TransparentAddressActivityResponse);

  // Aggregates ZIP-317 conventional fee floors over the inclusive block
  // range `[start_height, end_height]`. Capability:
  // `explorer.fee.summary_v1`.
  rpc FeeSummary(FeeSummaryRequest) returns (FeeSummaryResponse);

  // Returns chain-wide value pool totals at the upstream node's tip.
  // Composed from `WalletQuery.ChainValuePoolsAtTip`. Capability:
  // `explorer.value_pool.summary_v1`.
  rpc ValuePoolSummary(ValuePoolSummaryRequest) returns (ValuePoolSummaryResponse);
}

// `ExplorerQuery.ValuePoolSummary` request.
message ValuePoolSummaryRequest {}

// `ExplorerQuery.ValuePoolSummary` response.
//
// Mirrors `WalletQuery.ChainValuePoolsAtTipResponse` with the explorer's
// cross-cutting `ExplorerFreshness` envelope at field tag 1. Values are
// the cumulative chain totals reported by the upstream node, not
// per-block deltas.
message ValuePoolSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Upstream value-pool entries, preserved in upstream order so unknown
  // future pools can flow through without a wire-shape change.
  repeated zinder.v1.wallet.ChainValuePool pools = 2;

  // Tip height the upstream node observed when computing the pools.
  uint32 tip_height = 3;
}
