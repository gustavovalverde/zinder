syntax = "proto3";

package zinder.v1.explorer;

import "zinder/v1/ops/server_info.proto";
import "zinder/v1/wallet/wallet.proto";

// Explorer-plane server descriptor returned by `ExplorerQuery.ServerInfo`.
//
// `common` carries the cross-service identity, capability set, and
// deprecation metadata defined in [`zinder.v1.ops.ServerInfo`]. The
// `vendor` field is the only explorer-specific addition today.
message ExplorerServerInfo {
  // Cross-service identity and capability descriptor.
  zinder.v1.ops.ServerInfo common = 1;

  // Service vendor, always "Zinder".
  string vendor = 2;

  // Derive-plane health: whether the queryable projections are live with the
  // canonical tip, catching up, or paused. Lets an operator distinguish a
  // transient catch-up from a stalled derive plane without scraping metrics.
  // Absent until the ingest plane writes its first status record. See
  // `zinder.v1.wallet.DeriveStatus`.
  optional zinder.v1.wallet.DeriveStatus derive_status = 3;
}

// Server descriptor request.
message ServerInfoRequest {}

// Server descriptor response.
//
// Carries the standard `ExplorerFreshness` envelope per
// [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md)
// so consumers can read the upstream tip and capability versions from any
// explorer response, including the bootstrap call. Without this, the upstream
// tip (which rides on `ExplorerFreshness.chain_view.upstream_tip`) would only
// be reachable through derive-backed endpoints that are capability-gated and
// unavailable during `bulk_catchup`, leaving sync-progress UIs unable to
// compute an honest denominator at exactly the moment they most need it.
message ServerInfoResponse {
  ExplorerFreshness freshness = 1;
  ExplorerServerInfo info = 2;
}

// Per-field unavailability with structured reason and canonical text.
//
// Carried in `ExplorerFreshness.unavailable` so consumers can branch on
// the structured `reason` or render `human_reason` verbatim. The reason
// string comes from the canonical registry in
// `crates/zinder-core/src/explorer_reasons.rs`; the contract is defined in
// [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md).
message UnavailableField {
  // Dotted path matching the response field hierarchy, e.g.
  // `fee.computed.zip317_conventional_zat`.
  string field_path = 1;

  // Structured reason the field is absent.
  UnavailableReason reason = 2;

  // Canonical human-readable reason a UI can render verbatim.
  string human_reason = 3;
}

// Coarse classification of why an explorer field is absent.
enum UnavailableReason {
  UNAVAILABLE_REASON_UNSPECIFIED = 0;

  // Shielded by design; the value is private, not missing.
  UNAVAILABLE_PRIVATE_BY_DESIGN = 1;

  // Computation depends on prevouts that could not be resolved.
  UNAVAILABLE_PREVOUTS_MISSING = 2;

  // The upstream node does not expose the fact this field needs.
  UNAVAILABLE_UPSTREAM_NOT_SUPPORTED = 3;

  // The derived index does not yet contain this entity.
  UNAVAILABLE_NOT_INDEXED = 4;

  // Derived index is too far behind canonical to answer this view.
  UNAVAILABLE_STALE = 5;

  // The transaction includes sections the parser cannot decode.
  UNAVAILABLE_PARSER_VERSION_UNSUPPORTED = 6;
}

// Explorer response metadata that varies per call, carried at field tag 1 on
// every `ExplorerQuery` response.
//
// The chain-state axes (epoch, tips, upstream, derive) live on
// `chain_view`; this message keeps only the metadata that genuinely varies
// per call. Defined in
// [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md);
// every `ExplorerQuery` RPC's response carries this field tag 1 first so
// consumers can read `response.freshness` unconditionally.
message ExplorerFreshness {
  // Cross-plane chain-state envelope the response was produced from.
  zinder.v1.wallet.ChainView chain_view = 1;

  // Age of the mempool snapshot in milliseconds; zero for responses that
  // do not touch mempool state.
  uint64 snapshot_age_millis = 2;

  reserved 3, 4;
  reserved "derive_cursor_lag_blocks", "derive_cursor_lag_millis";

  // The capability string that produced this response. Lets clients branch
  // on which `_vN` was used to construct the response shape.
  string capability_version = 5;

  // Field-path-keyed unavailability entries.
  repeated UnavailableField unavailable = 6;

  reserved 7, 8;
  reserved "upstream", "indexed_head";
}

// Coarse transaction-format identifier.
//
// `effective_version` carries the integer version from
// [ZIP-225](https://zips.z.cash/zip-0225). `version_group_id` carries the
// raw `nVersionGroupId` for v3/v4/v5+ transactions. The discrete `kind`
// arm lets clients switch on a closed enum without parsing the integer.
enum TransactionVersionKind {
  TRANSACTION_VERSION_KIND_UNSPECIFIED = 0;
  TRANSACTION_VERSION_KIND_V1 = 1;
  TRANSACTION_VERSION_KIND_V2 = 2;
  TRANSACTION_VERSION_KIND_V3 = 3;
  TRANSACTION_VERSION_KIND_V4 = 4;
  TRANSACTION_VERSION_KIND_V5 = 5;
  TRANSACTION_VERSION_KIND_UNSUPPORTED = 6;
}

// Transaction-format identifier carried on the explorer wire.
message TransactionVersion {
  TransactionVersionKind kind = 1;
  uint32 effective_version = 2;
  optional uint32 version_group_id = 3;
}

// Coarse privacy classification computed by
// `zinder_core::classify_privacy_shape`.
enum PrivacyShape {
  PRIVACY_SHAPE_UNSPECIFIED = 0;
  PRIVACY_SHAPE_TRANSPARENT_ONLY = 1;
  PRIVACY_SHAPE_SHIELDING = 2;
  PRIVACY_SHAPE_DESHIELDING = 3;
  PRIVACY_SHAPE_SHIELDED_ONLY = 4;
  PRIVACY_SHAPE_MIXED = 5;
  PRIVACY_SHAPE_COINBASE = 6;
  PRIVACY_SHAPE_SHIELDED_COINBASE = 7;
  PRIVACY_SHAPE_UNCLASSIFIED = 8;
}

// Transaction lock-time classification.
//
// Mirrors `zinder_core::LockTime`: explicit `unlocked` marker, height-based
// lock time, or Unix-seconds lock time. The oneof is closed; clients
// switch on the present arm.
message LockTime {
  oneof kind {
    LockTimeUnlocked unlocked = 1;
    uint32 height = 2;
    uint64 unix_seconds = 3;
  }
}

// Discrete marker for the "no lock-time constraint" case.
message LockTimeUnlocked {}

// Component counts feeding the privacy classifier and the wire surface.
message TransactionComponentCounts {
  uint32 transparent_input_count = 1;
  uint32 transparent_output_count = 2;
  uint32 sapling_spend_count = 3;
  uint32 sapling_output_count = 4;
  uint32 orchard_action_count = 5;
  uint32 sprout_joinsplit_count = 6;
}

// Single typed value carrying every public fact the explorer renders for a
// transaction.
//
// Parsed once by `zinder_source::parse_transaction_public_facts` from raw
// transaction bytes plus the node-discovered network upgrade table per
// [ADR-0010](../../../../../docs/adrs/0010-transaction-public-facts.md).
message TransactionPublicFacts {
  // Canonical Zcash transaction identifier in RPC byte order (64 lowercase
  // hex characters; the form `zcash-cli`, every wallet UI, and every block
  // explorer display).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // ZIP-244 authorization digest in RPC byte order (64 lowercase hex
  // characters). Empty for v1-v4 transactions, which have no distinct
  // authorization digest.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string auth_digest = 2;

  // ZIP-239 witness identifier in RPC byte order: 128 lowercase hex
  // characters, the concatenation of the RPC-form `txid` (64 chars) and
  // the RPC-form `auth_digest` (64 chars). Empty for v1-v4 where wtxid
  // equals txid by definition.
  // References: ZIP 239; Zcash protocol spec term `\rpcByteOrder`.
  string wtxid = 3;

  // Coarse transaction-format identifier.
  TransactionVersion version = 4;

  // Consensus branch ID in the canonical 8-character lowercase hex form
  // (per the BIP70 / Zebra convention). Empty when not applicable (v1/v2).
  string consensus_branch_id_hex = 5;

  // Lock-time classification.
  LockTime lock_time = 6;

  // [ZIP-203](https://zips.z.cash/zip-0203) `nExpiryHeight` when present and
  // non-sentinel. Zero/unset means the transaction has no expiry.
  uint32 expiry_height = 7;

  // Raw transaction byte length.
  uint32 size_bytes = 8;

  // Component counts (transparent / Sapling / Orchard / Sprout).
  TransactionComponentCounts counts = 9;

  // Coarse privacy classification.
  PrivacyShape privacy_shape = 10;

  // `true` when the transaction is a coinbase row.
  bool is_coinbase = 11;
}

// Classification of a transaction's transparent prevout resolution state.
//
// `TransactionFeesConsumer` writes `RESOLVED` when every transparent input
// has a known prevout value in the wallet plane's prevout index, `PARTIAL`
// when at least one is missing, and `UNAVAILABLE` when the indexer is not
// resolving prevouts at all (the upstream node does not advertise
// `WALLET_READ_TRANSPARENT_OUTPUTS_V1`).
enum PrevoutResolutionStatus {
  PREVOUT_RESOLUTION_STATUS_UNSPECIFIED = 0;
  PREVOUT_RESOLUTION_STATUS_RESOLVED = 1;
  PREVOUT_RESOLUTION_STATUS_PARTIAL = 2;
  PREVOUT_RESOLUTION_STATUS_UNAVAILABLE = 3;
}

// Whether a transparent-address value event credits or debits the address.
//
// `RECEIVED` is a transparent output paying the address: the signed
// `value_zat` is positive and `index` is the output index. `SPENT` is a
// transparent input consuming one of the address's prior outputs: the
// signed `value_zat` is negative and `index` is the input index.
enum TransparentDeltaKind {
  TRANSPARENT_DELTA_KIND_UNSPECIFIED = 0;
  TRANSPARENT_DELTA_KIND_RECEIVED = 1;
  TRANSPARENT_DELTA_KIND_SPENT = 2;
}

// Per-input transparent prevout value carried on `TransactionDetail`.
//
// `input_index` is the zero-based position of the input in the
// transaction's transparent input list. `value_zat` is populated when the
// prevout could be resolved through the wallet plane's transparent prevout
// index; it is absent for inputs whose source transaction is not in the
// canonical index (for example, an old transaction the deployment's
// retention has dropped). Shielded spends are not emitted here at all:
// their values are encrypted by protocol and never derivable.
message TransparentInputDetail {
  uint32 input_index = 1;
  optional uint64 value_zat = 2;
}

// `ExplorerQuery.TransactionDetail` request.
//
// `at_epoch_id` optionally pins the read to a specific chain epoch so the
// response stays consistent with a concurrent caller's other reads.
message TransactionDetailRequest {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters; the form callers paste from a wallet or block explorer).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  optional uint64 at_epoch_id = 2;
}

// `ExplorerQuery.TransactionDetail` response.
//
// Carries the cross-cutting freshness envelope plus the parsed public
// facts, the shared transaction-location discriminator, and raw
// transaction bytes so consumers can keep parsed and raw forms together
// (per the PRD's user story 16).
//
// `location` is the same `zinder.v1.wallet.TransactionLocation` oneof
// `WalletQuery.Transaction` returns, so a consumer writes one match shape
// for both surfaces and TransactionDetail carries the `conflicting` arm.
//
// `paid_fee_zat`, `prevout_resolution_status`, and `transparent_inputs`
// are populated when the explorer advertises
// `EXPLORER_TRANSACTION_FEES_V1` and the `TransactionFeesConsumer` has
// materialized a row for `facts.transaction_id`. Otherwise the consumer
// falls back to `TransactionPublicFacts.counts.zip317_conventional_fee_zat`.
message TransactionDetailResponse {
  ExplorerFreshness freshness = 1;
  TransactionPublicFacts facts = 2;
  zinder.v1.wallet.TransactionLocation location = 3;
  optional uint64 paid_fee_zat = 5;
  PrevoutResolutionStatus prevout_resolution_status = 6;
  repeated TransparentInputDetail transparent_inputs = 7;
}

// Compact summary of one canonical block.
//
// Materialized once at derive time and read back by both
// `ExplorerQuery.BlockSummariesInRange` (projection) and
// `ExplorerQuery.BlockDetail` (full record). See
// [Explorer plane §Block view shape](../../../../../docs/architecture/explorer-plane.md#block-view-shape).
message BlockSummary {
  // Canonical block height.
  uint32 block_height = 1;

  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string block_hash = 2;

  // `nTime` from the block header.
  int64 block_time_unix_seconds = 3;

  // Number of transactions in the block, including the coinbase.
  uint32 transaction_count = 4;

  // Previous block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string previous_block_hash = 5;

  // Sum of serialized transaction byte lengths across the block. Includes
  // the coinbase transaction. Materialized by `BlockSummaryConsumer` at
  // commit time so the recent-blocks listing renders block size without
  // re-fetching every transaction.
  uint64 total_size_bytes = 6;

  // Sum of `zip317_conventional_fee_zat` across every non-coinbase
  // transaction in the block. ZIP-317 conventional floor; the actual
  // paid-fee sum is in `paid_fees_collected_zat` and only populated when
  // the `TransactionFeesConsumer` has resolved every transparent input.
  uint64 fees_collected_zat = 7;

  // Sum of actual paid fees across every non-coinbase transaction, when
  // every transparent input could be resolved through the wallet plane's
  // prevout index. Absent when at least one transaction is missing prevout
  // values; consumers fall back to `fees_collected_zat`.
  optional uint64 paid_fees_collected_zat = 8;

  // Value the coinbase output(s) paid out, in zatoshis. Includes any
  // shielded coinbase outputs per [ZIP-213](https://zips.z.cash/zip-0213).
  uint64 coinbase_reward_zat = 9;

  // Sum of Sapling output counts across every transaction in the block.
  // Useful for tracking shielded-protocol throughput per block.
  uint32 sapling_output_count = 10;

  // Sum of Orchard action counts across every transaction in the block.
  uint32 orchard_action_count = 11;

  // Distance from this block to the canonical tip at response time.
  // `1` when this block IS the tip, `2` for the block before, and so on.
  // Computed at request time from
  // `WalletQuery.LatestBlock.latest_block.height - block_height + 1`; not
  // stored in the derive column family.
  uint32 confirmations = 12;

  // True when this block is part of the canonical best chain at response
  // time. False during a rolling reorg window when the block has been
  // rewound but not yet replaced by a heavier chain. Computed at request
  // time; consumers render an "orphaned" badge when false.
  bool is_canonical = 13;
}

// Materialized storage record for the `BlockSummary` derive view.
//
// Not exposed by any RPC. Encoded once at derive time and read back by
// both `ExplorerQuery.BlockSummariesInRange` (projecting `summary`) and
// `ExplorerQuery.BlockDetail` (emitting `summary` plus `transaction_ids`).
// One record per canonical block, keyed by big-endian block height inside
// the consumer's `block_summary` column family.
message BlockSummaryRecord {
  BlockSummary summary = 1;
  // Transaction ids in canonical block order (each entry is 64 lowercase
  // hex characters in RPC byte order). The leading entry is the coinbase.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  repeated string transaction_ids = 2;
  // Number of non-coinbase transactions in this block.
  uint32 fee_transaction_count = 3;
  // Smallest ZIP-317 conventional fee floor among non-coinbase transactions,
  // zero when the block has no non-coinbase transactions.
  uint64 min_zip317_conventional_fee_zat = 4;
  // Largest ZIP-317 conventional fee floor among non-coinbase transactions,
  // zero when the block has no non-coinbase transactions.
  uint64 max_zip317_conventional_fee_zat = 5;
}

// `ExplorerQuery.BlockSummariesInRange` request.
//
// Returns one `BlockSummary` per canonical block in
// `[start_height, end_height]` inclusive, ordered by ascending height.
message BlockSummariesInRangeRequest {
  // First block height to return (inclusive).
  uint32 start_height = 1;

  // Last block height to return (inclusive).
  uint32 end_height = 2;

  // Optional chain-epoch id pin for snapshot consistency with concurrent reads.
  optional uint64 at_epoch_id = 3;
}

// `ExplorerQuery.BlockSummariesInRange` response.
message BlockSummariesInRangeResponse {
  ExplorerFreshness freshness = 1;
  repeated BlockSummary summaries = 2;
}

// `ExplorerQuery.BlockDetail` request.
//
// Either `block_height` or `block_hash` resolves the target block. Hash
// lookups consult the upstream wallet plane's
// `WalletQuery.BlockIdBySelector` indirection so the derive store keeps a
// single height-keyed schema.
message BlockDetailRequest {
  oneof selector {
    uint32 block_height = 1;
    // Canonical block hash in RPC byte order (64 lowercase hex
    // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
    string block_hash = 2;
  }

  // Optional chain-epoch id pin for snapshot consistency with concurrent reads.
  optional uint64 at_epoch_id = 3;
}

// `ExplorerQuery.BlockDetail` response.
//
// Carries the `BlockSummary` plus the canonical-ordered transaction ids the
// block committed. Clients render per-transaction rows by calling
// `ExplorerQuery.TransactionDetail` with each id; the v1 surface keeps
// per-transaction data out of the block-detail wire shape to avoid the
// fan-out cost of parsing every transaction at request time.
message BlockDetailResponse {
  ExplorerFreshness freshness = 1;
  BlockSummary summary = 2;

  // Transaction ids in canonical block order (each entry is 64 lowercase
  // hex characters in RPC byte order). The leading entry is the coinbase.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  repeated string transaction_ids = 3;
}

// Per-arm privacy refusal payload returned for shielded receivers,
// viewing keys, and shielded receivers within a unified address.
//
// The structured `reason` lets the UI branch on the refusal class while
// `human_reason` carries a canonical sentence the UI may render verbatim.
// `canonical_form` echoes the classified input when echoing is safe
// (e.g. a Sapling-encoded shielded address); it is omitted for viewing
// keys, where echoing would be a privacy regression.
message NotPubliclyIndexable {
  NotPubliclyIndexableReason reason = 1;
  string human_reason = 2;
  optional string canonical_form = 3;
}

// Discrete reason classes the explorer refuses public history for.
enum NotPubliclyIndexableReason {
  NOT_PUBLICLY_INDEXABLE_REASON_UNSPECIFIED = 0;

  // The input decoded as a shielded address (Sapling, Orchard, Sprout)
  // but the classifier could not narrow the network.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_ADDRESS = 1;

  // The input decoded as a viewing key (UIVK, UFVK, Sapling extended
  // viewing key). Echoing the key in the response would itself be a
  // privacy regression, so `canonical_form` is omitted.
  NOT_PUBLICLY_INDEXABLE_REASON_VIEWING_KEY = 2;

  // The receiver inside a unified address is shielded. The enclosing
  // `UnifiedAddressMatch` may still route transparent receivers from the
  // same input.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_RECEIVER_IN_UNIFIED = 3;

  // The input decoded as a mainnet shielded address (Sapling `zs1...`,
  // Orchard, or Sprout). Lets the consumer render network-specific help
  // text without inferring the network from the canonical form.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_ADDRESS_MAINNET = 4;

  // The input decoded as a testnet or regtest shielded address (Sapling
  // `zs1testsapling...` / `zregtestsapling...`, Orchard, or Sprout
  // testnet form). Distinguishes from `MAINNET` so the consumer can warn
  // a user that they may have switched networks.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_ADDRESS_TESTNET = 5;

  // The input decoded as a [ZIP-316](https://zips.z.cash/zip-0316)
  // unified address whose receiver list contains no transparent
  // receiver. The address itself is valid but the explorer cannot route
  // it to a transparent-history page; there is nothing publicly indexable
  // to look up.
  NOT_PUBLICLY_INDEXABLE_REASON_UNIFIED_ADDRESS_NO_TRANSPARENT_RECEIVER = 6;
}

// Block candidate produced when the input parses as a height or a
// 32-byte block hash that the upstream wallet confirms.
message BlockMatch {
  // Canonical block height of the resolved block.
  uint32 block_height = 1;

  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string block_hash = 2;
}

// Transaction candidate produced when the input parses as a 32-byte
// transaction id that the upstream wallet confirms.
//
// Mined transactions carry block-context fields; mempool transactions
// populate only the transaction id.
message TransactionMatch {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // True when the transaction is currently in the mempool.
  bool in_mempool = 2;

  // Populated when the transaction is mined; zero for mempool entries.
  uint32 mined_block_height = 3;

  // Mined block hash in RPC byte order (64 lowercase hex characters) when
  // the transaction is mined; empty for mempool entries.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string mined_block_hash = 4;
}

// Transparent (P2PKH or P2SH) address candidate.
//
// The classifier verifies that the input parses as a valid Zcash
// transparent address on the configured network; existence of on-chain
// history is not asserted.
message TransparentAddressMatch {
  // Canonical base58check form of the address.
  string canonical_form = 1;

  // SHA-256 of the canonical scriptPubKey, in 32-byte form. Matches the
  // `script_hash` selector accepted by every transparent-address request.
  bytes address_script_hash = 2;

  // True for P2PKH; false for P2SH.
  bool is_p2pkh = 3;
}

// ZIP-320 TEX address candidate.
//
// The classifier extracts the underlying P2PKH hash and re-encodes
// both the canonical `tex1.../textest1...` form and the equivalent
// `t1.../tm...` P2PKH form so the UI can link directly to the
// transparent-address page.
message TexAddressMatch {
  // Canonical Bech32m `tex1.../textest1...` form.
  string canonical_tex_form = 1;

  // Equivalent `t1.../tm...` P2PKH form that drives indexable history.
  string equivalent_p2pkh_form = 2;

  // Routable transparent match the UI can link to for history.
  TransparentAddressMatch transparent = 3;

  // Always `true`: TEX addresses constrain the sender to transparent
  // inputs only; on-chain the output is indistinguishable from the
  // underlying P2PKH.
  bool transparent_source_only = 4;

  // Canonical reason a UI may render verbatim.
  string spend_side_note = 5;
}

// ZIP-316 unified address candidate.
//
// The classifier decodes the receiver typecodes and surfaces each
// receiver as its own routing hint; transparent receivers carry a
// `TransparentAddressMatch`, while shielded receivers carry the typed
// `NotPubliclyIndexable` refusal.
message UnifiedAddressMatch {
  // Original Bech32m encoding of the input.
  string canonical_form = 1;

  // Network the unified address belongs to ("zcash-mainnet",
  // "zcash-testnet", "zcash-regtest"), matching the wire vocabulary in
  // `zinder.v1.ops.ServerInfo.network`.
  string network = 2;

  // One entry per ZIP-316 receiver typecode present in the unified
  // address, in the order declared by the encoding.
  repeated UnifiedAddressReceiver receivers = 3;
}

// Per-receiver routing inside a unified address.
message UnifiedAddressReceiver {
  UnifiedAddressReceiverKind kind = 1;
  oneof body {
    TransparentAddressMatch transparent = 2;
    NotPubliclyIndexable shielded = 4;
  }
}

// ZIP-316 receiver typecodes the classifier recognizes.
enum UnifiedAddressReceiverKind {
  UNIFIED_ADDRESS_RECEIVER_KIND_UNSPECIFIED = 0;

  // P2PKH transparent receiver (typecode 0x00).
  UNIFIED_ADDRESS_RECEIVER_KIND_P2PKH = 1;

  // P2SH transparent receiver (typecode 0x01).
  UNIFIED_ADDRESS_RECEIVER_KIND_P2SH = 2;

  // Sapling shielded receiver (typecode 0x02).
  UNIFIED_ADDRESS_RECEIVER_KIND_SAPLING = 3;

  // Orchard shielded receiver (typecode 0x03).
  UNIFIED_ADDRESS_RECEIVER_KIND_ORCHARD = 4;

  // Receiver typecode the classifier does not recognize. The receiver
  // body carries a `NotPubliclyIndexable` shape with
  // `UNAVAILABLE_PARSER_VERSION_UNSUPPORTED` semantics.
  UNIFIED_ADDRESS_RECEIVER_KIND_UNKNOWN = 5;
}

// Shielded-address candidate. The classifier always routes this arm
// through `NotPubliclyIndexable`; no storage call is ever issued.
message ShieldedAddressMatch {
  NotPubliclyIndexable not_publicly_indexable = 1;
}

// Viewing-key candidate. The classifier never echoes the key bytes,
// because doing so on the response surface would itself be a privacy
// regression even when the server never persists the key.
message ViewingKeyMatch {
  NotPubliclyIndexable not_publicly_indexable = 1;
}

// Payment-disclosure payload candidate. Reserved for the future
// payment-disclosure verifier; classified but not implemented in v1.
message PaymentDisclosureMatch {
  // Hint string a UI may render explaining the reserved state.
  string hint = 1;
}

// Catch-all candidate when no other arm classifies the input.
message UnclassifiedMatch {
  // Operator-readable hint explaining what the classifier expected.
  string hint = 1;
}

// One classified search candidate. Exactly one `match` arm is populated.
message SearchCandidate {
  oneof match {
    BlockMatch block = 1;
    TransactionMatch transaction = 2;
    TransparentAddressMatch transparent_address = 3;
    TexAddressMatch tex_address = 4;
    UnifiedAddressMatch unified_address = 5;
    ShieldedAddressMatch shielded_address = 6;
    ViewingKeyMatch viewing_key = 7;
    PaymentDisclosureMatch payment_disclosure = 8;
    UnclassifiedMatch unclassified = 9;
  }

  // Heuristic confidence in `[0.0, 1.0]`. `1.0` means the classifier is
  // structurally certain (e.g. address parsed cleanly); lower values
  // mean the arm is one of several plausible interpretations of the
  // same input (e.g. a short numeric string matches both a height and
  // the prefix of a possible txid).
  float confidence = 10;
}

// `ExplorerQuery.Search` request.
message SearchRequest {
  // Raw user input. Capped at 4 KiB on the server side; longer payloads
  // (e.g. ZIP-321 URIs, payment disclosures) are routed to dedicated
  // RPCs once those surfaces ship.
  string query = 1;
}

// `ExplorerQuery.Search` response. One request produces zero or more
// typed candidates; the UI renders the highest-confidence arm first.
message SearchResponse {
  ExplorerFreshness freshness = 1;
  repeated SearchCandidate candidates = 2;
}

// Per-shape count carried by [`MempoolSummaryResponse`].
message PrivacyShapeCount {
  PrivacyShape shape = 1;
  uint32 count = 2;
}

// Per-version count carried by [`MempoolSummaryResponse`].
message TransactionVersionCount {
  TransactionVersionKind kind = 1;
  uint32 count = 2;
}

// `ExplorerQuery.MempoolSummary` request.
//
// Optionally pins the read to a specific chain epoch so the response
// stays consistent with concurrent reads.
message MempoolSummaryRequest {
  optional uint64 at_epoch_id = 1;
}

// `ExplorerQuery.MempoolSummary` response.
//
// Aggregates the current mempool snapshot into a single page-friendly
// shape: total counts, byte size, privacy-shape distribution, version
// distribution, and freshness extremes. The handler parses every entry
// via `zinder_source::parse_transaction_public_facts` so the shape and
// version classifiers stay in lockstep with `TransactionDetail`.
message MempoolSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Number of transactions in the snapshot.
  uint32 transaction_count = 2;

  // Sum of `size_bytes` across every entry.
  uint64 total_size_bytes = 3;

  // One entry per privacy shape present in the snapshot; shapes with
  // zero entries are omitted.
  repeated PrivacyShapeCount privacy_shape_distribution = 4;

  // One entry per transaction version kind present in the snapshot;
  // versions with zero entries are omitted.
  repeated TransactionVersionCount version_distribution = 5;

  // Age of the oldest mempool entry (largest `first_seen_unix_millis`
  // delta vs. now). Zero when the snapshot is empty.
  uint64 oldest_entry_age_millis = 6;

  // Age of the newest mempool entry (smallest `first_seen_unix_millis`
  // delta vs. now). Zero when the snapshot is empty.
  uint64 newest_entry_age_millis = 7;
}

// `ExplorerQuery.MempoolActivity` request.
//
// Returns the current mempool entries sorted by newest-first observation
// time. The cursor is opaque and encodes the prior page's last entry so
// subsequent calls resume past it. Mempool state is transient; restarted
// pages may return new entries that arrived since the prior call.
message MempoolActivityRequest {
  uint32 max_entries = 1;
  bytes from_cursor = 2;
}

// One mempool entry projected into the explorer wire shape.
message MempoolActivityEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // Wall-clock time when the indexer first observed this entry.
  uint64 first_seen_unix_millis = 2;

  // Raw transaction byte length.
  uint32 size_bytes = 3;

  // Coarse privacy classification computed from the parsed facts.
  PrivacyShape privacy_shape = 4;

  // Coarse transaction version classification.
  TransactionVersion version = 5;

  // ZIP-317 conventional fee floor for this entry, in zatoshis. Always
  // populated.
  uint64 zip317_conventional_fee_zat = 6;

  // Actual paid fee, in zatoshis. Populated when the explorer advertises
  // `EXPLORER_TRANSACTION_FEES_V1` and the wallet plane's mempool prevout
  // index resolved every transparent input for this entry. Absent
  // otherwise; consumers fall back to `zip317_conventional_fee_zat`.
  optional uint64 paid_fee_zat = 7;

  // ZIP-317 logical-action count for this entry. The fee floor formula's
  // input; surfaced separately so consumers can render fee-per-action
  // without re-deriving from the component counts.
  uint32 logical_actions = 8;
}

// `ExplorerQuery.MempoolActivity` response.
message MempoolActivityResponse {
  ExplorerFreshness freshness = 1;
  repeated MempoolActivityEntry entries = 2;
  bytes next_cursor = 3;
}

// `ExplorerQuery.TransparentAddressActivity` request.
//
// Returns confirmed transparent-address activity from the derive
// projection. Mempool activity for a transparent address is served
// separately through `MempoolActivity` so each surface has one source
// of truth.
message TransparentAddressActivityRequest {
  // Selector for the transparent address being queried.
  zinder.v1.wallet.AddressLookup address = 1;

  // Inclusive minimum block height. Zero means start from genesis.
  uint32 start_height = 2;

  // Inclusive maximum block height.
  uint32 end_height = 3;

  // Server-bounded maximum entries per page. Zero means use the server
  // default; values larger than the server's configured cap are silently
  // clamped.
  uint32 max_entries = 4;

  // Empty resumes from the head of the timeline. Non-empty resumes
  // strictly after the prior page's last entry.
  //
  // Ordering: rows are always emitted newest-first; the consumer's
  // storage layout is descending by height. Clients that want oldest-
  // first reverse the page client-side.
  bytes from_cursor = 5;

  // Reserved tag for the deleted `descending` field. The handler always
  // serves newest-first; the previous bool led to an ordering bug when
  // requested as ascending, so the field was removed instead of fixed
  // (clients reverse client-side when they need ascending order).
  reserved 6;
  reserved "descending";

  // Optional chain-epoch id pin.
  optional uint64 at_epoch_id = 7;
}

// One transparent-address confirmed-activity row.
//
// Materialized by `TransparentAddressActivityConsumer` at commit time.
// `net_value_zat` is positive when the transaction paid the address and
// negative when it spent from the address. Absent when prevout
// resolution did not produce a complete picture; the
// `prevout_resolution_status` field disambiguates why.
message TransparentAddressActivityEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // Canonical block height of the confirming block.
  uint32 block_height = 2;

  // `nTime` from the confirming block header.
  int64 block_time_unix_seconds = 3;

  // Signed net value, in zatoshis, the transaction moved into the
  // address. Set only when every prevout the transaction spends for this
  // address was resolved; see `prevout_resolution_status`.
  optional sint64 net_value_zat = 4;

  // Number of transparent inputs in the transaction that spent from
  // this address. The parent message scopes the address; the field name
  // does not repeat the discriminator.
  uint32 input_count = 5;

  // Number of transparent outputs in the transaction that paid this
  // address.
  uint32 output_count = 6;

  // Why `net_value_zat` is or is not set. Always populated.
  PrevoutResolutionStatus prevout_resolution_status = 7;
}

// `ExplorerQuery.TransparentAddressActivity` response.
message TransparentAddressActivityResponse {
  ExplorerFreshness freshness = 1;
  repeated TransparentAddressActivityEntry entries = 2;
  bytes next_cursor = 3;
}

// `ExplorerQuery.TransparentAddressDeltas` request.
//
// Returns the per-event signed value series for one transparent address
// over an inclusive height range, ordered ascending. One entry per received
// output and per resolved spend, so the series is strictly finer than
// `TransparentAddressActivity`, which folds the same events into one net row
// per transaction. The mempool view is served separately through
// `MempoolActivity`.
message TransparentAddressDeltasRequest {
  // Selector for the transparent address being queried.
  zinder.v1.wallet.AddressLookup address = 1;

  // Inclusive minimum block height. Zero means start from genesis.
  uint32 start_height = 2;

  // Inclusive maximum block height.
  uint32 end_height = 3;

  // Server-bounded maximum entries per page. Zero means use the server
  // default; values larger than the server's configured cap are silently
  // clamped.
  uint32 max_entries = 4;

  // Empty resumes from the oldest event in range. Non-empty resumes
  // strictly after the prior page's last entry.
  //
  // Ordering: events are always emitted ascending (oldest first), matching
  // the zcashd `getaddressdeltas` order. The sibling
  // `TransparentAddressActivity` is deliberately newest-first; this surface
  // is the ascending per-event counterpart.
  bytes from_cursor = 5;

  // Optional chain-epoch id pin.
  optional uint64 at_epoch_id = 6;
}

// One signed transparent-address value event.
//
// Materialized by `TransparentAddressDeltasConsumer` at commit time. A
// received output carries a positive `value_zat` and the output index; a
// spent prevout carries a negative `value_zat` and the input index. Spend
// events use `spent_value_zat` recorded on the canonical spend fact, so they
// need no prevout re-resolution at read time. A spend whose prevout cannot
// be resolved produces no event rather than a wrong number.
message TransparentAddressDeltasEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // Canonical block height of the confirming block.
  uint32 block_height = 2;

  // `nTime` from the confirming block header.
  int64 block_time_unix_seconds = 3;

  // Output index for a received output, input index for a spent prevout.
  uint32 index = 4;

  // Signed value, in zatoshis, the event moved for the address. Positive
  // for a received output, negative for a spent prevout.
  sint64 value_zat = 5;

  // Whether the event credits (`RECEIVED`) or debits (`SPENT`) the address.
  TransparentDeltaKind kind = 6;
}

// `ExplorerQuery.TransparentAddressDeltas` response.
message TransparentAddressDeltasResponse {
  ExplorerFreshness freshness = 1;
  repeated TransparentAddressDeltasEntry entries = 2;
  bytes next_cursor = 3;
}

// Per-event record materialized by `TransparentAddressDeltasConsumer`.
//
// Storage-only: never returned directly on the wire. Encoded into the
// `transparent_address_deltas` column family value bytes; the key carries
// `(address_script_hash, ascending_height, in_block_position, kind, index)`.
// The handler projects this onto `TransparentAddressDeltasEntry`, pulling
// the height from the key.
message TransparentAddressDeltasRecord {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  int64 block_time_unix_seconds = 2;
  // Signed value the event moved for the address; positive for a received
  // output, negative for a spent prevout.
  sint64 value_zat = 3;
}

// `ExplorerQuery.FeeSummary` request.
//
// Aggregates per-transaction ZIP-317 conventional fee floors over the
// inclusive block range `[start_height, end_height]` from the typed
// `BlockSummaryRecord` facts materialized by the derive plane.
message FeeSummaryRequest {
  uint32 start_height = 1;
  uint32 end_height = 2;
}

// `ExplorerQuery.FeeSummary` response.
//
// The fee fields are ZIP-317 conventional fee floors, not miner-collected
// fees. Computing actual fees requires prevout resolution and is
// intentionally out of scope for `v1`; the conventional-fee floor is the
// minimum a wallet should attach to a transaction with the given shape.
message FeeSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Number of canonical blocks the response aggregated.
  uint32 block_count = 2;

  // Number of non-coinbase transactions across the aggregated range.
  // Coinbase transactions are excluded because they have no fee.
  uint32 transaction_count = 3;

  // Sum of `zip317_conventional_fee_zat` across every non-coinbase
  // transaction.
  uint64 total_zip317_conventional_fee_zat = 4;

  // Smallest `zip317_conventional_fee_zat` observed across the range,
  // zero when the range carries no non-coinbase transactions.
  uint64 min_zip317_conventional_fee_zat = 5;

  // Largest `zip317_conventional_fee_zat` observed across the range,
  // zero when the range carries no non-coinbase transactions.
  uint64 max_zip317_conventional_fee_zat = 6;
}

// Explorer-shaped read surface served by zinder-explorer.
service ExplorerQuery {
  // Returns the consumer-side capability descriptor.
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);

  // Returns a typed read model for one transaction. Capability:
  // `explorer.transaction.detail_v1`.
  rpc TransactionDetail(TransactionDetailRequest)
      returns (TransactionDetailResponse);

  // Returns one `BlockSummary` per canonical block in the requested
  // height range, ordered by ascending height. Capability:
  // `explorer.block.summary_v1`.
  rpc BlockSummariesInRange(BlockSummariesInRangeRequest)
      returns (BlockSummariesInRangeResponse);

  // Returns one `BlockSummary` plus the canonical-ordered transaction ids
  // for the requested block. Capability: `explorer.block.detail_v1`.
  rpc BlockDetail(BlockDetailRequest) returns (BlockDetailResponse);

  // Classifies a raw user input string into typed search candidates per
  // [ADR-0012](../../../../../docs/adrs/0012-typed-explorer-search-and-privacy-refusal.md).
  // Shielded receivers, viewing keys, and shielded receivers inside
  // unified addresses route to the typed `NotPubliclyIndexable` arm and
  // never reach a storage read. Capability: `explorer.search_v1`.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Aggregates the current mempool snapshot into a single explorer-shaped
  // response: total counts, byte size, privacy-shape distribution,
  // version distribution, and freshness extremes. Capability:
  // `explorer.mempool.summary_v1`.
  rpc MempoolSummary(MempoolSummaryRequest) returns (MempoolSummaryResponse);

  // Returns the current mempool entries sorted by newest-first
  // observation time, paged with an opaque cursor. Mempool state is
  // transient; subsequent pages may interleave with new arrivals.
  // Capability: `explorer.mempool.activity_v1`.
  rpc MempoolActivity(MempoolActivityRequest) returns (MempoolActivityResponse);

  // Returns the confirmed transparent-address activity feed materialized
  // by `TransparentAddressActivityConsumer`. The mempool view for an
  // address is served separately through `MempoolActivity` so each
  // surface has one source of truth. Capability:
  // `explorer.transparent_address.activity_v1`.
  rpc TransparentAddressActivity(TransparentAddressActivityRequest)
      returns (TransparentAddressActivityResponse);

  // Returns the per-event signed value series for one transparent address
  // over an inclusive height range, ordered ascending (oldest first).
  // Materialized by `TransparentAddressDeltasConsumer`. The per-transaction
  // net folds these same events; this surface emits each received output and
  // each resolved spend individually. Capability:
  // `explorer.transparent_address.deltas_v1`.
  rpc TransparentAddressDeltas(TransparentAddressDeltasRequest)
      returns (TransparentAddressDeltasResponse);

  // Aggregates ZIP-317 conventional fee floors over the inclusive block
  // range `[start_height, end_height]`. Capability:
  // `explorer.fee.summary_v1`.
  rpc FeeSummary(FeeSummaryRequest) returns (FeeSummaryResponse);

  // Returns chain-wide value pool totals at the upstream node's tip.
  // Composed from `WalletQuery.ChainValuePoolsAtTip`. Capability:
  // `explorer.value_pool.summary_v1`.
  rpc ValuePoolSummary(ValuePoolSummaryRequest) returns (ValuePoolSummaryResponse);

  // Returns the chain-wide transparent UTXO-set summary: the count and total
  // value of unspent transparent outputs at the settled tip. Composed from
  // `WalletQuery.TransparentUtxoSetSummary`. Capability:
  // `explorer.utxo_set.summary_v1`.
  rpc UtxoSetSummary(UtxoSetSummaryRequest) returns (UtxoSetSummaryResponse);

  // Returns rolling counts of mempool events from the per-second counter
  // column family. Replaces consumer-side in-memory ring buffers.
  // Capability: `explorer.mempool.event_counts_v1`.
  rpc MempoolEventCounts(MempoolEventCountsRequest)
      returns (MempoolEventCountsResponse);

  // Streams the newest-first projection of canonical transactions from
  // the `recent_transactions` derive column family. Capability:
  // `explorer.transaction.recent_v1`.
  rpc RecentTransactions(RecentTransactionsRequest)
      returns (stream RecentTransactionsChunk);

  // Verifies a [ZIP-311](https://zips.z.cash/zip-0311) payment disclosure
  // in-process. Operator opt-in. When the capability
  // `explorer.payment_disclosure.verify_v1` is absent the consumer falls
  // back to its own local verifier. The handler applies strict redaction
  // so the request bytes never reach span attributes.
  rpc VerifyPaymentDisclosure(VerifyPaymentDisclosureRequest)
      returns (VerifyPaymentDisclosureResponse);

  // Returns one coherent point-in-time bundle of every field a consumer
  // needs to render an overview dashboard. The handler anchors the bundle
  // on a single `WalletQuery.LatestBlock` tip and reads every other field
  // from the derive store in one pass, so all fields share one
  // `ExplorerFreshness` and one snapshot identity. Replaces the per-card
  // fan-out (`MempoolSummary` + `FeeSummary` + `ValuePoolSummary` +
  // `BlockSummariesInRange` + `RecentTransactions` + `MempoolEventCounts`)
  // that consumers would otherwise stitch together client-side and that
  // cannot guarantee tip-coherence across calls. Capability:
  // `explorer.overview.snapshot_v1`.
  rpc OverviewSnapshot(OverviewSnapshotRequest)
      returns (OverviewSnapshotResponse);
}

// `ExplorerQuery.ValuePoolSummary` request.
message ValuePoolSummaryRequest {}

// `ExplorerQuery.ValuePoolSummary` response.
//
// Mirrors `WalletQuery.ChainValuePoolsAtTipResponse` with the explorer's
// cross-cutting `ExplorerFreshness` envelope at field tag 1. Values are
// the cumulative chain totals reported by the upstream node, not
// per-block deltas.
message ValuePoolSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Upstream value-pool entries, preserved in upstream order so unknown
  // future pools can flow through without a wire-shape change.
  repeated zinder.v1.wallet.ChainValuePool pools = 2;

  // Tip height the upstream node observed when computing the pools.
  uint32 tip_height = 3;
}

// `ExplorerQuery.UtxoSetSummary` request.
message UtxoSetSummaryRequest {
  // Optional chain-epoch id pin for the canonical read. Absent resolves
  // against the visible tip; present pins the read to a specific epoch.
  optional uint64 at_epoch_id = 1;
}

// `ExplorerQuery.UtxoSetSummary` response.
//
// The chain-wide transparent UTXO-set aggregate, computed by a request-time
// full scan of the current-UTXO projection at the settled tip
// (gettxoutsetinfo-equivalent). `hash_serialized` and `bytes_serialized` are
// intentionally omitted: both depend on a defined UTXO-set serialization
// ordering that Zinder does not commit to, so only the order-independent
// count and value totals are reported.
message UtxoSetSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Number of unspent transparent outputs at the summarized settled tip.
  uint64 utxo_count = 2;

  // Sum of the values of every unspent transparent output, in zatoshi.
  uint64 total_value_zat = 3;

  // Settled tip height the aggregate was taken at. Below this height the
  // projection is the irreversible unspent set.
  uint32 summarized_height = 4;

  // Homomorphic commitment to the full unspent set. Mirrors the wallet-plane
  // field: present only when the server advertises
  // `explorer.utxo_set.commitment_v1`, absent otherwise.
  optional zinder.v1.wallet.TransparentUtxoSetCommitment commitment = 5;
}

// Per-row record materialized by `TransparentAddressActivityConsumer`.
//
// Storage-only: never returned directly on the wire. Encoded into the
// `transparent_address_activity` column family value bytes; the key
// carries `(address_script_hash, reverse_height, in_block_position)`.
// The handler projects this onto the wire `TransparentAddressActivityEntry`
// shape and pulls the height + timestamp it already knows from the key.
message TransparentAddressActivityRecord {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  int64 block_time_unix_seconds = 2;
  // Net transparent value the transaction moved for this address
  // (`sum(outputs to address) - sum(prevouts spent from address)`).
  //
  // Set only when `prevout_resolution_status == Resolved` AND every
  // prevout the transaction reads was successfully resolved. Partial
  // resolution leaves this field unset rather than reporting a half-
  // summed value as if it were complete (see ADR-0018).
  optional sint64 net_value_zat = 3;
  uint32 input_count = 4;
  uint32 output_count = 5;
  // Status of the prevout resolution that produced (or did not produce)
  // `net_value_zat`. Always present so consumers can render a chip
  // explaining why `net_value_zat` is unset rather than guessing.
  PrevoutResolutionStatus prevout_resolution_status = 6;
}

// Per-transaction record materialized by `TransactionFeesConsumer`.
//
// Storage-only: never returned directly on the wire. The
// `TransactionDetail` handler reads this record and projects the values
// onto `TransactionDetailResponse`; the `MempoolActivity` handler reads
// it to populate the per-entry `paid_fee_zat`. One record per non-
// coinbase transaction the consumer has indexed; the key is the canonical
// 32-byte transaction id.
message TransactionFeesRecord {
  // Paid fee in zatoshis (`sum(transparent_input_value) -
  // sum(transparent_output_value)` for transparent-only transactions;
  // unset for transactions with any shielded inputs since the shielded
  // contribution stays inside the protocol pools).
  optional uint64 paid_fee_zat = 1;

  // Status of the prevout resolution that produced `paid_fee_zat`.
  PrevoutResolutionStatus prevout_resolution_status = 2;

  // Per-input transparent prevout values, indexed by transparent input
  // position. Coinbase inputs are not represented (coinbase transactions
  // do not appear in this column family).
  repeated TransparentInputDetail transparent_inputs = 3;

  // ZIP-317 logical-action count, mirrored from the parsed component
  // counts so the mempool path can populate `MempoolActivityEntry.logical_actions`
  // without re-parsing.
  uint32 logical_actions = 4;
}

// `ExplorerQuery.RecentTransactions` request.
//
// Streams the newest-first projection of canonical transactions
// materialized by `RecentTransactionsConsumer`. Replaces the
// `BlockSummariesInRange` + per-block `BlockDetail` + per-tx
// `TransactionDetail` round-trip tree a consumer would otherwise issue
// for a "recent transactions" surface.
message RecentTransactionsRequest {
  // Hard cap on entries returned across all stream chunks. Server clamps
  // to the configured maximum.
  uint32 max_entries = 1;

  // Empty resumes from the canonical tip. Non-empty resumes strictly
  // after the prior page's last entry.
  bytes from_cursor = 2;
}

// One streaming chunk of `RecentTransactions` entries.
message RecentTransactionsChunk {
  ExplorerFreshness freshness = 1;
  bytes cursor = 2;
  repeated RecentTransactionEntry entries = 3;
}

// One row in the `recent_transactions` projection.
//
// Denormalized to keep a "recent transactions" panel renderable from one
// streaming RPC.
//
// Field-presence rules (see ADR-0018):
// - `zip317_conventional_fee_zat` is set for every non-coinbase row and
//   unset for coinbase. (Coinbase transactions collect block rewards
//   rather than paying fees; treating zero as "no fee" would conflate
//   "coinbase reward path" with "paid no fee", and a `Some(0)` sentinel
//   would force readers to special-case coinbase anyway.)
// - `paid_fee_zat` is set only when the consumer resolved every
//   transparent prevout via `WalletQuery.TransparentOutputsByOutpoint` AND the
//   transaction has no shielded inputs.
message RecentTransactionEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  uint32 block_height = 2;
  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string block_hash = 3;
  int64 block_time_unix_seconds = 4;
  bool is_coinbase = 5;
  PrivacyShape privacy_shape = 6;
  TransactionComponentCounts component_counts = 7;
  uint32 size_bytes = 8;
  optional uint64 zip317_conventional_fee_zat = 9;
  optional uint64 paid_fee_zat = 10;
  // ZIP-317 logical-action count for the transaction. Always set,
  // including for coinbase (which contributes a single transparent
  // output and therefore logical_actions = 1 after the GRACE_ACTIONS
  // floor is applied at the fee layer, but the unfloored count here is
  // the raw shape value).
  uint32 logical_actions = 11;
}

// `ExplorerQuery.MempoolEventCounts` request.
//
// Returns rolling counts of `Added`, `Mined`, `Invalidated`, and
// `Suppressed` mempool events from the per-second counter column family
// `MempoolEventCountsConsumer` writes. The server clamps `window_seconds`
// to `[60, 3600]`; passing zero asks for the server default (300).
message MempoolEventCountsRequest {
  uint32 window_seconds = 1;
}

// `ExplorerQuery.MempoolEventCounts` response.
message MempoolEventCountsResponse {
  ExplorerFreshness freshness = 1;

  // Effective window size after server clamping.
  uint32 window_seconds = 2;

  // Number of `Added` events the source emitted during the window.
  uint32 added_count = 3;

  // Number of `Mined` events the source emitted during the window.
  uint32 mined_count = 4;

  // Number of `Invalidated` events the source emitted during the window.
  uint32 invalidated_count = 5;

  // Number of `Suppressed` events the source emitted during the window.
  // Stays zero for sources that do not surface ZIP-401
  // `RecentlyEvicted`-style admission refusals.
  uint32 suppressed_count = 6;
}

// `ExplorerQuery.VerifyPaymentDisclosure` request.
//
// Carries the opaque [ZIP-311](https://zips.z.cash/zip-0311) payment-
// disclosure bytes. The server applies strict redaction: the request
// bytes never reach span attributes or logs; only the verdict and the
// optional `public_facts` on a `VALID` response are observable.
message VerifyPaymentDisclosureRequest {
  bytes payment_disclosure_bytes = 1;
}

// `ExplorerQuery.VerifyPaymentDisclosure` response.
message VerifyPaymentDisclosureResponse {
  ExplorerFreshness freshness = 1;
  PaymentDisclosureVerdict verdict = 2;

  // Echoed only when `verdict` is `VALID`. The redaction rules above
  // apply to anything echoed back through this field.
  optional PaymentDisclosurePublicFacts public_facts = 3;
}

// Discrete verdict the payment-disclosure verifier returns.
enum PaymentDisclosureVerdict {
  PAYMENT_DISCLOSURE_VERDICT_UNSPECIFIED = 0;
  PAYMENT_DISCLOSURE_VERDICT_VALID = 1;
  PAYMENT_DISCLOSURE_VERDICT_INVALID_SIGNATURE = 2;
  PAYMENT_DISCLOSURE_VERDICT_TRANSACTION_NOT_FOUND = 3;
  PAYMENT_DISCLOSURE_VERDICT_MALFORMED = 4;
}

// Public facts the verifier echoes back on a `VALID` verdict.
//
// Field set is intentionally minimal so the verifier's output cannot be
// used to bypass ZIP-311's redaction contract. The transaction id is
// already public; the payment id binds the disclosure to a specific
// payment subject; the disclosed amount is what the disclosure asserts
// the payment moved.
message PaymentDisclosurePublicFacts {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  // Opaque ZIP-311 payment identifier carried verbatim from the disclosure
  // payload. Not a Zcash hash; kept as raw bytes.
  bytes payment_id = 2;
  uint64 disclosed_value_zat = 3;
}

// Typed error returned when a derive-RPC cursor has expired.
//
// Per the explorer-plane cursor contract (see
// `docs/architecture/explorer-plane.md`): cursors are valid for the
// lifetime of the column-family snapshot at issue time. The server
// rejects a cursor that references a height range no longer in the store
// (reorged out, or rolled off retention) with this typed error attached
// to the gRPC status's `details`. Consumers re-issue from the start of
// the range or jump to `recommended_resume_height`.
message CursorExpiredError {
  // Height the server now considers the safe starting point for a fresh
  // cursor. Set to the canonical tip when the consumer should restart at
  // the head of the projection; set to the lowest still-indexed height
  // when the consumer should restart earlier.
  uint32 recommended_resume_height = 1;

  // Short reason hint a UI can render verbatim. The canonical sentences
  // live in `crates/zinder-core/src/explorer_reasons.rs`.
  string hint = 2;
}

// `ExplorerQuery.OverviewSnapshot` request.
//
// All limit fields clamp at the server side: zero requests the default,
// values above the cap are silently lowered. Callers receive the
// effective values back inside the response (`recent_blocks.len()`,
// `recent_transactions.len()`, `mempool_events.window_seconds`,
// `fee_summary.block_count`).
message OverviewSnapshotRequest {
  // Number of `recent_blocks` entries to return, newest-first.
  // Range `[1, 16]`; default 8 when zero.
  uint32 recent_blocks_limit = 1;

  // Number of `recent_transactions` entries to return, newest-first.
  // Drives both the recent-transactions list and the privacy-mix
  // aggregation on the consumer side. Range `[1, 64]`; default 32 when
  // zero.
  uint32 recent_transactions_limit = 2;

  // Sliding-window size for `mempool_events` in seconds. Range
  // `[60, 3600]`; default 300 when zero. Matches the clamp range of
  // `MempoolEventCountsRequest.window_seconds`.
  uint32 mempool_window_seconds = 3;

  // Lookback for `fee_summary`, in blocks ending at the snapshot's tip.
  // Range `[1, 256]`; default 50 when zero. Matches the per-request cap
  // of `FeeSummaryRequest`.
  uint32 fee_summary_block_count = 4;
}

// `ExplorerQuery.OverviewSnapshot` response.
//
// All sub-fields are read against the snapshot identified by
// `freshness.chain_epoch`; the bundle never spans two tips. The handler
// reads the wallet tip once and every derive-store field once, in one
// pass, then assembles the single freshness envelope. Consumers compare
// `freshness.chain_epoch` (and the higher-level `tip_hash` they derive
// from it) across responses to detect snapshot boundary crosses.
message OverviewSnapshotResponse {
  // Cross-cutting envelope (field tag 1 per ADR-0011). Single freshness
  // for the entire bundle.
  ExplorerFreshness freshness = 1;

  // Header-block timestamp of the snapshot's tip. Surfaced separately
  // from `ChainEpoch` because the current `wallet.ChainEpoch` does not
  // carry block time; consumers render "Ns ago" without a second lookup.
  // Set to zero when the upstream has no committed blocks.
  int64 tip_block_time_unix_seconds = 2;

  // Mempool snapshot (counts and freshness extremes) at the bundle's
  // observation instant.
  OverviewMempool mempool = 3;

  // Rolling counts of mempool events over a sliding window ending at the
  // bundle's observation instant.
  OverviewMempoolEvents mempool_events = 4;

  // Fee summary over the last `fee_summary_block_count` blocks ending at
  // the snapshot's tip.
  OverviewFeeSummary fee_summary = 5;

  // Chain-wide value pool totals at the snapshot's tip. Preserves
  // upstream order so unknown future pools flow through without a wire
  // shape change.
  repeated zinder.v1.wallet.ChainValuePool value_pools = 6;

  // Top-K block summaries ending at the snapshot's tip, ordered by
  // descending height. `recent_blocks[0]` is the tip; `recent_blocks[K-1]`
  // is the oldest entry in the window.
  repeated BlockSummary recent_blocks = 7;

  // Top-N recent canonical transactions, newest-first. The consumer
  // uses this single array for both the "recent transactions" list
  // (typically the first 8) and the "privacy mix" aggregation (typically
  // all 32). Mirrors the per-entry shape `RecentTransactionEntry`
  // returned by `ExplorerQuery.RecentTransactions`.
  repeated RecentTransactionEntry recent_transactions = 8;
}

// Mempool sub-field of `OverviewSnapshotResponse`.
//
// Mirrors the counts and freshness extremes from `MempoolSummaryResponse`.
// The distribution arrays (`privacy_shape_distribution`,
// `version_distribution`) are deliberately omitted from the bundle: the
// overview surface aggregates privacy shape from `recent_transactions`
// instead, and the version distribution is a per-feature concern served
// by `ExplorerQuery.MempoolSummary` for callers that need it.
message OverviewMempool {
  // Number of transactions in the snapshot.
  uint32 transaction_count = 1;

  // Sum of `size_bytes` across every entry.
  uint64 total_size_bytes = 2;

  // Age of the oldest mempool entry vs. the bundle's observation instant.
  // Zero when the snapshot is empty.
  uint64 oldest_entry_age_millis = 3;

  // Age of the newest mempool entry vs. the bundle's observation instant.
  // Zero when the snapshot is empty.
  uint64 newest_entry_age_millis = 4;
}

// Mempool-event sub-field of `OverviewSnapshotResponse`.
//
// Mirrors `MempoolEventCountsResponse`. The `window_seconds` field is the
// effective server-clamped value, not the requested value; consumers can
// rely on it for cadence math without echoing the request.
message OverviewMempoolEvents {
  // Effective window size after server clamping.
  uint32 window_seconds = 1;

  // Number of `Added` events the source emitted during the window.
  uint32 added_count = 2;

  // Number of `Mined` events the source emitted during the window.
  uint32 mined_count = 3;

  // Number of `Invalidated` events the source emitted during the window.
  uint32 invalidated_count = 4;

  // Number of `Suppressed` events the source emitted during the window.
  // Stays zero for sources that do not surface ZIP-401-style admission
  // refusals.
  uint32 suppressed_count = 5;
}

// Fee-summary sub-field of `OverviewSnapshotResponse`.
//
// Mirrors `FeeSummaryResponse`. The values aggregate ZIP-317
// conventional-fee floors across non-coinbase transactions in the last
// `block_count` blocks ending at the snapshot's tip.
message OverviewFeeSummary {
  // Effective number of blocks the aggregate was computed over after
  // server clamping. Identical to `recent_blocks.len()` only when the
  // caller's `recent_blocks_limit` equals `fee_summary_block_count`;
  // otherwise the two windows can differ.
  uint32 block_count = 1;

  // Number of non-coinbase transactions in the aggregate. Zero when the
  // window contains only coinbases.
  uint32 transaction_count = 2;

  // Sum of `zip317_conventional_fee_zat` across the window. Zero when
  // `transaction_count == 0`.
  uint64 total_zip317_conventional_fee_zat = 3;

  // Smallest `zip317_conventional_fee_zat` observed in the window. Zero
  // when `transaction_count == 0`.
  uint64 min_zip317_conventional_fee_zat = 4;

  // Largest `zip317_conventional_fee_zat` observed in the window. Zero
  // when `transaction_count == 0`.
  uint64 max_zip317_conventional_fee_zat = 5;
}
