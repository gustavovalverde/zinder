syntax = "proto3";

package zinder.v1.ingest;

import "zinder/v1/ops/readiness.proto";
import "zinder/v1/ops/server_info.proto";
import "zinder/v1/wallet/wallet.proto";

// IngestControl ServerInfo request. Same shape as every Zinder ServerInfo;
// orchestrators that probe the writer's identity and capability set use
// this rpc.
message ServerInfoRequest {}

// IngestControl ServerInfo response.
//
// Carries the cross-service `ops.ServerInfo` message. Operators probing
// the writer get the same descriptor shape they get from WalletQuery,
// without the wallet-specific retention or reorg-window fields.
message ServerInfoResponse {
  zinder.v1.ops.ServerInfo server_info = 1;
}

// Private ingest control-plane request for the writer's latest committed
// chain epoch.
message WriterStatusRequest {}

// Current phase of the unified ingest loop. Orthogonal to readiness
// `cause`: a writer in `WRITER_PHASE_BULK_CATCHUP` may report `syncing`
// (normal) or `upstream_not_ready` (Zebra itself is behind). See ADR-0015.
enum WriterPhase {
  // Default scalar so unset fields do not silently match a real phase.
  WRITER_PHASE_UNSPECIFIED = 0;
  // Upstream tip is below the catch-up floor (regtest near genesis or
  // freshly initialized nodes). The loop polls on the upstream-health
  // interval and emits `cause=upstream_not_ready` until enough chain
  // exists to commit.
  WRITER_PHASE_AWAITING_UPSTREAM = 1;
  // Gap to the upstream tip is above `ingest.phases.catchup_threshold_blocks`.
  // The bulk-catchup driver runs pipelined block fetches and commits
  // batches with `FinalizeThrough`.
  WRITER_PHASE_BULK_CATCHUP = 2;
  // Gap is within the catch-up threshold. The serial tip-follow driver
  // commits one block per poll cycle.
  WRITER_PHASE_FOLLOWING_TIP = 3;

  // Reserved slots for additive growth. Removing a reserved range is a
  // breaking change.
  reserved 4 to 15;
}

// Private ingest control-plane response used by colocated secondary readers
// to compute RocksDB-secondary replica lag.
message WriterStatusResponse {
  // Cross-plane chain-state envelope. The writer's latest committed chain
  // epoch (with its visible and settled tips) rides on
  // `chain_view.chain_epoch`; `chain_view.upstream_tip` carries the upstream
  // observation. Absent when the writer has not committed a chain epoch yet.
  optional zinder.v1.wallet.ChainView chain_view = 1;

  // Stable public network name, such as "zcash-regtest". Carried outside
  // `chain_view` because it is known before the first commit.
  string network_name = 2;

  reserved 3, 4;
  reserved "latest_writer_tip_height", "latest_writer_safe_tip_height";

  // Current phase of the unified ingest loop. ADR-0015.
  WriterPhase phase = 5;

  // Reserved by a future ADR for the bulk-catchup transport identity.
  // Skipped today because the JSON-RPC adapter is the only backend; the
  // value would carry no signal.
  reserved 6;

  // Distance from the writer's visible tip to the observed upstream tip
  // when known. Drives phase classification; populated whenever the writer
  // has both a store tip and an upstream tip observation.
  optional uint32 gap_blocks = 7;

  // Last upstream-health observation. Unset when no probe has produced a
  // sample yet (writer still in the `STARTING` window) or when the
  // upstream is healthy. Carries the same payload `ReadinessReport`
  // surfaces under `cause=upstream_not_ready`; readers parse one struct
  // for both surfaces. ADR-0015 §Upstream sync detection.
  optional zinder.v1.ops.UpstreamNotReadyDetail upstream_not_ready = 8;
}

// Private ingest control-plane RPCs for colocated read replicas.
service IngestControl {
  // Returns the writer's identity and capability set in the cross-service
  // ops.ServerInfo shape.
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);

  // Returns the writer's latest committed chain epoch.
  rpc WriterStatus(WriterStatusRequest) returns (WriterStatusResponse);

  // Streams chain-event history from the ingest writer's primary store.
  rpc ChainEvents(zinder.v1.wallet.ChainEventsRequest) returns (stream zinder.v1.wallet.ChainEventEnvelope);

  // Returns a bounded snapshot of the writer's live mempool index.
  //
  // Secondary readers cannot observe the live in-process mempool index
  // through RocksDB-secondary catchup, so the wallet data plane proxies
  // mempool snapshots through this control RPC.
  rpc MempoolSnapshot(zinder.v1.wallet.MempoolSnapshotRequest) returns (zinder.v1.wallet.MempoolSnapshotResponse);

  // Streams mempool events from the writer's mempool event log.
  rpc MempoolEvents(zinder.v1.wallet.MempoolEventsRequest) returns (stream zinder.v1.wallet.MempoolEventEnvelope);

  // Returns unmined transparent outputs that fund a transparent address.
  //
  // Secondary readers cannot observe the writer's live `MempoolIndex`
  // through RocksDB-secondary catchup, so the wallet data plane proxies
  // transparent-mempool point lookups through this control RPC.
  rpc TransparentMempoolOutputsByAddress(zinder.v1.wallet.TransparentMempoolOutputsByAddressRequest)
      returns (zinder.v1.wallet.TransparentMempoolOutputsByAddressResponse);

  // Returns the unmined spends of a batch of transparent outpoints, when
  // any are visible in the writer's live mempool index.
  rpc TransparentMempoolSpendsByOutpoint(zinder.v1.wallet.TransparentMempoolSpendsByOutpointRequest)
      returns (zinder.v1.wallet.TransparentMempoolSpendsByOutpointResponse);

  // Resolves a batch of outpoints against the writer's live mempool index.
  //
  // Used by chained-mempool flows: outpoints that reference outputs of
  // unconfirmed mempool transactions resolve here without a canonical-chain
  // round trip.
  rpc TransparentMempoolOutputsByOutpoint(zinder.v1.wallet.TransparentMempoolOutputsByOutpointRequest)
      returns (zinder.v1.wallet.TransparentOutputsByOutpointResponse);

  // Returns chain-wide value pool totals at the upstream node's tip by
  // calling `getblockchaininfo.valuePools`. The wallet data plane proxies
  // through this RPC because the wallet has no source handle.
  rpc ChainValuePoolsAtTip(zinder.v1.wallet.ChainValuePoolsAtTipRequest)
      returns (zinder.v1.wallet.ChainValuePoolsAtTipResponse);
}
