[package]
name = "zinder-testkit"
version.workspace = true
description = "Deterministic chain, store, and node fixtures for Zinder tests"
edition.workspace = true
readme = "../../README.md"
keywords = ["zcash", "indexer", "testkit", "fixtures"]
categories = ["development-tools::testing"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
color-eyre.workspace = true
eyre.workspace = true
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
orchard.workspace = true
parking_lot.workspace = true
rand = "0.8"
serde_json.workspace = true
secp256k1 = { version = "0.29.1", default-features = false, features = ["alloc"] }
sapling = { package = "sapling-crypto", version = "0.7.0", default-features = false }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "sync"] }
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zcash_address = { version = "0.13.0", default-features = false, features = ["std"] }
zcash_primitives = { version = "0.29.0", default-features = false, features = ["circuits", "transparent-inputs", "std", "test-dependencies"] }
zcash_protocol = { version = "0.10.1", default-features = false, features = ["local-consensus", "std"] }
zcash_transparent = { version = "0.9.0", default-features = false, features = ["transparent-inputs", "std"] }
zinder-core.workspace = true
zinder-materialized-views.workspace = true
zinder-source.workspace = true
zinder-store.workspace = true
zinder-wallet-rocksdb.workspace = true
zip32 = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-stream.workspace = true

[lints]
workspace = true
